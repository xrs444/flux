name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['*']
    tags-ignore: ['*']

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Pinned by commit SHA (fluxcd/pkg main @ 2026-11-07), not @main — these
      # actions default to "latest" of each tool, so an unpinned @main changing
      # upstream or a new tool release could silently change what passes. The
      # explicit version: inputs below are the actual pin; keep them in sync
      # with scripts/validate.sh's prerequisites comment and
      # scripts/install-validator-toolchain.sh.
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@7fb9589778fa8045a1000cb6cfcf9ddd4cd0bf65
        with:
          version: 4.54.2
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@7fb9589778fa8045a1000cb6cfcf9ddd4cd0bf65
        with:
          version: 0.8.0
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@7fb9589778fa8045a1000cb6cfcf9ddd4cd0bf65
        with:
          version: 5.8.3
      - name: Validate manifests
        run: ./scripts/validate.sh
