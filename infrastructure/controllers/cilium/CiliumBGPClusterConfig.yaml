---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster-config
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: xsvr-conn
      localASN: 65001
      peers:
        - name: xsvr-vip
          peerASN: 65000
          peerAddress: 172.20.3.200
          peerConfigRef:
            name: xsvr-peer
        - name: xsvr-vip-v6
          peerASN: 65000
          peerAddress: fd66:150f:7361:16::200
          peerConfigRef:
            name: xsvr-peer-v6
