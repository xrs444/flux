---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
        namespace: flux-system
      version: "1.12.1"
  interval: 5m30s
  install:
    createNamespace: true
    remediation:
      retries: 5
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    timeout: 15m
    remediation:
      remediateLastFailure: true
      retries: 5
  values:
    # Talos Linux compatibility configuration
    # Talos requires special settings since it doesn't include
    # iSCSI tools by default

    defaultSettings:
      # Backup configuration
      # Using CIFS/SMB to work around Talos NFSv4.1/4.2 mounting restrictions
      # CIFS mounts work reliably on Talos where NFS direct mounts fail
      backupTarget: "cifs://172.20.3.201/longhorn-backups"
      backupTargetCredentialSecret: "cifs-secret"
      backupExecutionTimeout: "900"  # 15 minutes in seconds for system backups

      # Storage settings
      defaultDataPath: /var/lib/longhorn
      defaultReplicaCount: 2

      # Talos-specific: Disable iSCSI checks
      # The manager will skip iSCSI validation on Talos nodes
      disableSchedulingOnCordonedNode: true
      storageMinimalAvailablePercentage: 10

      # System component configuration
      systemManagedComponentsNodeSelector: ""
      # Semicolon-separated list of taints to tolerate
      taintToleration: >-
        node-role.kubernetes.io/control-plane:NoSchedule;
        node-role.kubernetes.io/ha-only=reserved:NoSchedule;
        memory-constrained=true:NoSchedule

      # CSI sidecars/plugin ran fully unconstrained (BestEffort QoS, no
      # request/limit at all) before the 2026-10-29 xsvr1 memory-exhaustion
      # incident — BestEffort pods are first in line for the kernel OOM
      # killer, which is exactly what crash-looped longhorn-csi-plugin and
      # friends during that event. Component names must match the chart's
      # documented supported list exactly (see `helm show values longhorn/
      # longhorn --version 1.12.1` around systemManagedCSIComponentsResourceLimits).
      systemManagedCSIComponentsResourceLimits: '{"csi-attacher":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"csi-provisioner":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"csi-resizer":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"csi-snapshotter":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"longhorn-csi-plugin":{"requests":{"cpu":"50m","memory":"256Mi"},"limits":{"cpu":"500m","memory":"1Gi"}},"node-driver-registrar":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"cpu":"50m","memory":"64Mi"}},"longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"cpu":"50m","memory":"64Mi"}}}'

    # Longhorn Manager configuration
    longhornManager:
      # Also unconstrained before the xsvr1 incident — see
      # systemManagedCSIComponentsResourceLimits comment above. 1Gi limit
      # sized above the ~500-900Mi observed via `kubectl top` cluster-wide.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      # Node selector for Talos compatibility
      nodeSelector: {}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
          operator: Exists
        - key: node-role.kubernetes.io/ha-only
          effect: NoSchedule
          operator: Equal
          value: reserved
        - key: memory-constrained
          effect: NoSchedule
          operator: Equal
          value: "true"

    # Longhorn Driver configuration
    longhornDriver:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
          operator: Exists
        - key: node-role.kubernetes.io/ha-only
          effect: NoSchedule
          operator: Equal
          value: reserved
        - key: memory-constrained
          effect: NoSchedule
          operator: Equal
          value: "true"

    # CSI components
    csi:
      attacherReplicaCount: 3
      provisionerReplicaCount: 3
      resizerReplicaCount: 3
      snapshotterReplicaCount: 3

    # Storage class configuration
    # defaultClass is false because longhorn-retain (storageclass-longhorn-reclaim.yaml)
    # is the intended cluster default, not this chart-managed "longhorn" class
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 2

    # Disable pre-upgrade checker for Talos (it checks for iSCSI)
    preUpgradeChecker:
      jobEnabled: false

    # Enable Prometheus ServiceMonitor for in-cluster scraping
    metrics:
      serviceMonitor:
        enabled: true
        interval: 30s

    # Chart default (restrictInternalTraffic: true) ships default-deny-ingress
    # NetworkPolicies on longhorn-manager/webhook/backing-image-* with no exception
    # for the monitoring namespace's Prometheus scrape (longhorn-backend:9500) or for
    # anything outside Longhorn's own pods. These policies already exist live and were
    # previously inert only because Cilium's cluster-wide policyAuditMode was on — the
    # moment that flips off (network-segmentation project, docs/network-segmentation.md)
    # they enforce and Longhorn metrics go dark. Disabled here; longhorn-system is
    # reassessed for a proper CiliumNetworkPolicy replacement when it's onboarded to
    # the segmentation rollout (T0 tier, last).
    networkPolicies:
      enabled: false
      restrictInternalTraffic: false
