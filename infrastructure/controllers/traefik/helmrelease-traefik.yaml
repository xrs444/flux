---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      version: "42.4.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  interval: 15m
  timeout: 10m
  releaseName: traefik
  install:
    timeout: 10m
    crds: Create
    remediation:
      retries: 5
  upgrade:
    timeout: 5m
    crds: CreateReplace
    remediation:
      retries: 5
      remediateLastFailure: true
  values:
    deployment:
      enabled: true
      replicas: 1
    ingressRoute:
      dashboard:
        enabled: true
    service:
      enabled: true
      # These live under service.spec — the chart ignored them as top-level
      # keys (even on 41.x) and rejects them outright from 42.3.1. Until now
      # externalTrafficPolicy: Local was only on the live Service because of
      # a manual `kubectl patch` (2025-06-19), not because of this file.
      spec:
        externalTrafficPolicy: Local
        loadBalancerIP: 172.21.0.2
  valuesFrom:
    - kind: ConfigMap
      name: traefik-helm-chart-value-overrides
      valuesKey: values.yaml
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
