---
# Sealed via kubeseal against the live sealed-secrets controller
# (flux/infrastructure/controllers/sealedsecrets/). `address` is the key
# notification-controller's generic Provider reads via secretRef.
#
# Points at a DEDICATED flow — f/sre/flux-alert-ingest__flow, NOT
# f/sre/alert-ingest — because Flux's generic-provider payload shape
# ({involvedObject, severity, reason, message, timestamp}) is nothing like
# Alertmanager's ({status, commonLabels, alerts[]}), and the existing
# alert-ingest flow's post_ntfy/kanban_card_upsert steps read the latter
# shape. Reusing that flow for Flux events would collapse every distinct
# Kustomization failure into one "UnknownAlert" card and, worse, spam
# ntfy/create+complete a card on every successful ~10m reconcile if info-
# severity events weren't filtered — Flux emits far more events than just
# failures. A separate flow keeps the well-tested Alertmanager path
# completely untouched.
#
# The token value reuses the SAME credential as
# flux/apps/observability/monitoring/secret-alertmanager-config.secret.yaml,
# on the assumption (per .wolf/cerebrum.md's documented URL-shape note —
# flow vs script webhooks differ only in the /f/ vs /p/ path segment) that a
# Windmill webhook token authorizes any job-run endpoint the token's scope
# covers, not one specific path. NOT verified live. If Flux's alerts 401 at
# this URL, generate a dedicated webhook token for this flow in the Windmill
# UI and reseal this secret with that value instead — same pattern as
# f/sre/ntfy_token, which is deliberately a manual post-deploy step.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: flux-alert-webhook
  namespace: flux-system
spec:
  encryptedData:
    address: 
  template:
    metadata:
      name: flux-alert-webhook
      namespace: flux-system
