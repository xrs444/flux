---
# Closes a documented gap: Flux reconciliation failures were previously
# invisible to the alert pipeline (notification-controller's CRDs were
# installed but zero Provider/Alert objects existed anywhere in this
# tree). Routes into a DEDICATED Windmill flow — f/sre/flux-alert-ingest__flow,
# not the existing Alertmanager f/sre/alert-ingest__flow — because Flux's
# generic-provider payload ({involvedObject, severity, reason, message,
# timestamp}) doesn't match Alertmanager's ({status, commonLabels, alerts[]})
# and reusing that flow would misparse every field. See
# sealedsecret-flux-alert-webhook.yaml for the full reasoning.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: flux-alert-ingest
  namespace: flux-system
spec:
  type: generic
  secretRef:
    name: flux-alert-webhook
