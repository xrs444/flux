# Network-segmentation project, Phase 1 baseline (see .claude/plans in the
# parent repo and .wolf/cerebrum.md 2026-09-11 entry for full context).
#
# Applies only to namespaces opted in via the `netpol.homeprod/enforce: "true"`
# label. An unlabeled namespace is selected by no policy here and stays
# allow-all, identical to today — that label is the per-namespace rollback
# lever for this whole project.
#
# Without this, nothing in an opted-in namespace can resolve any name at all.
# Confirmed live via Hubble flow capture 2026-09-11: DNS egress to kube-system
# CoreDNS (k8s-app=kube-dns) is universal across every namespace sampled.
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline-dns-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.netpol.homeprod/enforce: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
