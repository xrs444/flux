---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
data:
  server.yml: |
    # Base configuration
    base-url: https://ntfy.xrs444.net
    cache-file: /var/cache/ntfy/cache.db
    auth-file: /var/lib/ntfy/user.db
    auth-default-access: deny-all
    behind-proxy: true

    # Upstream base URL: required for the official Android/iOS ntfy app to
    # receive background push via FCM/APNs. Without this, self-hosted ntfy
    # has no push path and messages are only delivered while the app has an
    # open "Instant delivery" WebSocket (or not at all, on iOS).
    upstream-base-url: https://ntfy.sh

    # Prometheus metrics
    enable-metrics: true

    # Access Control List
    # ACL is managed via init container using 'ntfy access' commands
    # Default access: deny-all (configured above)
    # This ensures users can only access their designated topics
