---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: borgwarehouse
  namespace: borgwarehouse
  labels:
    app: borgwarehouse
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: borgwarehouse
  template:
    metadata:
      labels:
        app: borgwarehouse
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /home/borgwarehouse/.ssh
              chmod 700 /home/borgwarehouse/.ssh
              chown -R 1000:1000 /home/borgwarehouse/app/config
              chown -R 1000:1000 /home/borgwarehouse/logs
          volumeMounts:
            - name: borgwarehouse-config
              mountPath: /home/borgwarehouse/app/config
            - name: borgwarehouse-ssh
              mountPath: /home/borgwarehouse/.ssh
            - name: borgwarehouse-logs
              mountPath: /home/borgwarehouse/logs
            - name: borgwarehouse-repos
              mountPath: /home/borgwarehouse/repos
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
      containers:
        - name: borgwarehouse
          image: borgwarehouse/borgwarehouse:v3.8.1
          ports:
            - containerPort: 3000
              name: http
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: TZ
              value: "America/Phoenix"
            # Better Auth (v3.8.0+) rejects requests whose Origin isn't its
            # base URL / trusted origins ("Invalid origin" -> login fails).
            - name: BETTER_AUTH_URL
              value: "https://borgwarehouse.xrs444.net"
            - name: BETTER_AUTH_TRUSTED_ORIGINS
              value: "https://borgwarehouse.xrs444.net"
            # Kanidm SSO (generic OIDC) — password login stays enabled
            # alongside it (DISABLE_PASSWORD_LOGIN unset) until OIDC login
            # has actually been verified end to end, to avoid a repeat
            # lockout if the SSO config turns out to be wrong.
            - name: OIDC_ISSUER_URL
              value: "https://idm.xrs444.net/oauth2/openid/oauth2_borgwarehouse"
            - name: OIDC_PROVIDER_NAME
              value: "Kanidm"
            # Kanidm's client_id is the client NAME, not the entry UUID the
            # secret's client-id key holds (UUID -> invalid_client_id).
            - name: OIDC_CLIENT_ID
              value: "oauth2_borgwarehouse"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-secret-borgwarehouse
                  key: client-secret
          volumeMounts:
            - name: borgwarehouse-config
              mountPath: /home/borgwarehouse/app/config
            - name: borgwarehouse-ssh
              mountPath: /home/borgwarehouse/.ssh
            - name: borgwarehouse-ssh-host
              mountPath: /etc/ssh
            - name: borgwarehouse-repos
              mountPath: /home/borgwarehouse/repos
            - name: borgwarehouse-tmp
              mountPath: /home/borgwarehouse/tmp
            - name: borgwarehouse-logs
              mountPath: /home/borgwarehouse/logs
      volumes:
        - name: borgwarehouse-config
          persistentVolumeClaim:
            claimName: borgwarehouse-config-pvc
        - name: borgwarehouse-ssh
          persistentVolumeClaim:
            claimName: borgwarehouse-ssh-pvc
        - name: borgwarehouse-ssh-host
          persistentVolumeClaim:
            claimName: borgwarehouse-ssh-host-pvc
        - name: borgwarehouse-repos
          persistentVolumeClaim:
            claimName: borgwarehouse-devicebackups-pvc
        - name: borgwarehouse-tmp
          emptyDir: {}
        - name: borgwarehouse-logs
          persistentVolumeClaim:
            claimName: borgwarehouse-logs-pvc
