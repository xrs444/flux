---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise
  namespace: apprise
  labels:
    app: apprise
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apprise
  template:
    metadata:
      labels:
        app: apprise
    spec:
      initContainers:
        # Render ${NTFY_APPRISE_PASSWORD} in the config template into a writable
        # emptyDir volume. Apprise API does not support env var substitution
        # natively (https://github.com/caronc/apprise/issues/1156), so envsubst
        # is used here. The rendered /config dir is also writable, which fixes
        # CONFIG_PERMISSION_ISSUE in the Apprise health status.
        - name: render-config
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext
              envsubst < /config-template/apprise.yml > /config/apprise.yml
          env:
            - name: NTFY_APPRISE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apprise-ntfy-credentials
                  key: password
          volumeMounts:
            - name: apprise-config-template
              mountPath: /config-template
              readOnly: true
            - name: apprise-config-rendered
              mountPath: /config
      containers:
        - name: apprise
          image: caronc/apprise:v1.5.4
          ports:
            - containerPort: 8000
              name: http
          # apprise-api's tag-routed /notify/<key> endpoint reads from its own internal
          # persistent store (populated only via POST /add/<key>), not from CONFIG_DIR
          # directly — dropping apprise.yml on disk (render-config init container) is not
          # enough on its own. Without this hook, /notify/apprise silently 204s with zero
          # URLs loaded on every pod restart (bug-578, recurred as bug seen 2026-09-22
          # after this pod had been up 26h with an empty store). Loop until the server is
          # actually accepting connections, then register the rendered config.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until curl -sf -o /dev/null http://localhost:8000/; do sleep 1; done
                    curl -sf -X POST http://localhost:8000/add/apprise \
                      --data-urlencode format=yaml \
                      --data-urlencode config@/config/apprise.yml
          volumeMounts:
            - name: apprise-config-rendered
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1024Mi
      volumes:
        - name: apprise-config-template
          configMap:
            name: apprise-config
        - name: apprise-config-rendered
          emptyDir: {}
