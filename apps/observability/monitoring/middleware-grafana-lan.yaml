---
# Restricts anonymous Grafana access (auth.anonymous in the kube-prometheus-stack
# HelmRelease) to the internal network — anonymous auth is org-wide in Grafana
# and can't be scoped to a single dashboard, so the network layer is what keeps
# it off the public internet.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-lan-only
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 172.16.0.0/12 # internal estate (172.18/172.20/172.21)
      - 100.64.0.0/10 # Tailscale CGNAT range
