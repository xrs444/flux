---
# Recording rules producing a uniform status gauge (0/1/2) per monitored
# target, consumed by the "Overall System Status" dashboard's tile grid.
#   2 = GOOD (green)     — operating normally
#   1 = CAUTION (yellow) — an issue exists but the item is still operational
#   0 = WARNING (red)    — down / faulted / impacts the service
#
# All queries reference real, verified job labels from prometheus-additional-scrape-configs
# (job "node", "talos-node", "blackbox-icmp-net", "blackbox-ssl") and ServiceMonitor-derived
# jobs (job "cert-manager", "traefik-metrics", "cilium-agent", "longhorn-backend",
# "kube-state-metrics", "coredns", "spegel", "apiserver"). kube_deployment_/
# kube_statefulset_ metrics depend on the kube-state-metrics ServiceMonitor's
# honorLabels: true fix (servicemonitor-kube-state-metrics.yaml) — without it every
# series reports namespace="monitoring" regardless of the resource's real namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: status-state
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: homeprod-status-state
      interval: 1m
      rules:
        # Bare-metal hosts: down (0) / up but under disk or memory pressure (1) / healthy (2).
        - record: homeprod:host:pressure
          expr: |
            (
              max by (instance) (
                (node_filesystem_avail_bytes{job="node",mountpoint="/"} / node_filesystem_size_bytes{job="node",mountpoint="/"} < 0.10)
                or
                (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 0.10)
              )
            )
            or
            (up{job="node"} * 0)
        - record: homeprod:host:state
          expr: clamp_min((2 * up{job="node"}) - homeprod:host:pressure, 0)

        # Talos Kubernetes VM nodes — binary up/down (node health detail is
        # covered separately by the "Nodes Ready" / "Pods Not Running" tiles).
        - record: homeprod:talos_node:state
          expr: 2 * up{job="talos-node"}

        # Network devices (core stack, edge switches, APs) — ICMP liveness only
        # for now. SNMP-based per-interface caution (ifOperStatus) can be folded
        # in once the "snmp" job (NetBox tag snmp-monitor, HTTP SD) is confirmed
        # populated after the netbox-api-token fix lands.
        - record: homeprod:net:state
          expr: 2 * probe_success{job="blackbox-icmp-net"}

        # HTTPS endpoints — down (0) / reachable but TLS cert expiring within
        # 14 days (1) / healthy (2). The `< bool` comparison is required: a
        # plain `<` filters out non-matching series instead of returning 0,
        # which collapsed the whole expression to empty whenever no cert was
        # near expiry (the common case).
        - record: homeprod:endpoint:state
          expr: |
            clamp_min(
              (2 * probe_success{job="blackbox-ssl"})
              - (probe_success{job="blackbox-ssl"} * on(instance) (probe_ssl_earliest_cert_expiry{job="blackbox-ssl"} - time() < bool 14 * 86400)),
              0
            )

        # Longhorn storage — healthy (2) / any volume degraded (1) / any volume faulted (0).
        - record: homeprod:storage:state
          expr: |
            clamp_min(
              2
              - clamp_max(sum(longhorn_volume_robustness{state="degraded"}) or vector(0), 1)
              - (2 * clamp_max(sum(longhorn_volume_robustness{state="faulted"}) or vector(0), 1)),
              0
            )

        # Infrastructure services with a dedicated metrics job — binary up/down.
        - record: homeprod:infra:state
          expr: |
            2 * up{job=~"prometheus|traefik-metrics|cilium-agent|cert-manager|longhorn-backend|kube-state-metrics|spegel|coredns|apiserver|netbox|homeassistant|asterisk|powerdns-api|immich-metrics|sonarr-metrics|radarr-metrics|lidarr-metrics"}

        # Apps without a dedicated metrics job — replica-count based, one series
        # per (namespace, deployment) or (namespace, statefulset): 0 = no ready
        # replicas, 1 = partially available, 2 = fully available.
        # `sum by (namespace, deployment/statefulset)` on every term keeps both
        # sides of each `+` on an identical label set — `on(...)` alone drops
        # every label except the ones listed, so adding it to an un-reduced
        # term (full kube-state-metrics label set) never found a match and
        # the whole expression came out empty. `bool` is required on both
        # comparisons for the same reason as homeprod:endpoint:state. The
        # statefulset desired-replica metric is kube_statefulset_replicas,
        # not kube_statefulset_spec_replicas (that name doesn't exist).
        - record: homeprod:app:state
          expr: |
            clamp_min(
              (
                (sum by (namespace, deployment) (kube_deployment_status_replicas_available) > bool 0)
                +
                (sum by (namespace, deployment) (kube_deployment_status_replicas_available) >= bool on(namespace, deployment) sum by (namespace, deployment) (kube_deployment_spec_replicas))
              )
              or
              (
                (sum by (namespace, statefulset) (kube_statefulset_status_replicas_ready) > bool 0)
                +
                (sum by (namespace, statefulset) (kube_statefulset_status_replicas_ready) >= bool on(namespace, statefulset) sum by (namespace, statefulset) (kube_statefulset_replicas))
              ),
              0
            )
