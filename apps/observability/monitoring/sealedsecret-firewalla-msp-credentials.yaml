# yamllint disable rule:line-length
# Same MSP token as flux/apps/mcpjungle/sealedsecret-mcp-firewalla-credentials.yaml,
# resealed here since k8s Secrets are namespace-scoped and this exporter runs in
# monitoring, not mcp-gateway.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: firewalla-msp-credentials
  namespace: monitoring
spec:
  encryptedData:
    msp-token: 
  template:
    metadata:
      name: firewalla-msp-credentials
      namespace: monitoring
