---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firewalla-exporter
  namespace: monitoring
  labels:
    app: firewalla-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firewalla-exporter
  template:
    metadata:
      labels:
        app: firewalla-exporter
    spec:
      # Kubernetes auto-injects <SERVICE_NAME>_PORT-style env vars into every
      # pod in the namespace for every Service that exists — collided with our
      # own FIREWALLA_EXPORTER_PORT var (now renamed to FIREWALLA_METRICS_PORT
      # to dodge it), crash-looping with "invalid literal for int(): tcp://...".
      # Belt-and-suspenders: also disable the injection outright.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: firewalla-exporter
          # Built by .github/workflows/build-firewalla-exporter-image.yml on every push
          # to apps/observability/monitoring/firewalla-exporter/. Floating :latest tag —
          # if staleness ever bites (Spegel P2P mirror caching an old digest under the
          # same tag, seen live with mcpjungle-custom), switch to digest-pinning like
          # deployment-mcpjungle.yaml does.
          image: ghcr.io/xrs444/firewalla-exporter:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FIREWALLA_MSP_ID
              value: "dn-j3almw.firewalla.net"
            - name: FIREWALLA_MSP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firewalla-msp-credentials
                  key: msp-token
          ports:
            - containerPort: 9878
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
            failureThreshold: 3
