# yamllint disable rule:line-length
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '91.9.0'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    remediation:
      retries: 3
    crds: CreateReplace
  values:
    # Disable bundled exporters — these are already deployed separately or not needed
    nodeExporter:
      enabled: false
    kubeStateMetrics:
      enabled: false
    # Cilium replaces kube-proxy on this cluster (Talos cluster.proxy.disabled: true
    # in Talos/controlplane.yaml) — no kube-proxy exists to scrape, ever.
    kubeProxy:
      enabled: false

    # Prometheus configuration
    prometheus:
      prometheusSpec:
        # Chart ships no resources/tolerations/affinity by default — Prometheus
        # ran fully unconstrained, and sat on xsvr4 (81% memory used) during
        # the 2026-10-29 xsvr1 OOM incident, i.e. the thing meant to show you
        # the event was itself at risk of being killed by a similar one.
        # Pinned to xsvr2 instead (80GiB VM, ~8% used) via the reserved
        # node-role.kubernetes.io/ha-only taint — see Talos/patches/v-k8s-xsvr2.yaml.
        # Limit sized above observed usage (1572Mi via `kubectl top`).
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
        tolerations:
          - key: node-role.kubernetes.io/ha-only
            operator: Equal
            value: reserved
            effect: NoSchedule
          # xsvr2 is ALSO a control-plane node and already carries this
          # taint — see descheduler's helmrelease for the full explanation.
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/ha-only
                      operator: In
                      values:
                        - reserved
        retention: 30d
        retentionSize: 45GiB
        storageSpec:
          volumeClaimTemplate:
            metadata:
              # Tells the stock KubePersistentVolumeFillingUp alert to skip
              # this PVC (its own "unless kube_persistentvolumeclaim_labels{
              # label_excluded_from_alerts="true"}" clause) -- predict_linear
              # can't see that retentionSize below caps growth at 45GiB, so it
              # reads the climb toward that ceiling as heading to 100% and
              # keeps firing a false "days to full" alert. Requires
              # kube-state-metrics' --metric-labels-allowlist to actually
              # expose this label (apps/core/kube-state-metrics/deployment.yaml).
              labels:
                excluded_from_alerts: "true"
            spec:
              storageClassName: longhorn-retain
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 50Gi
        # Additional scrape configs from Secret (bare-metal hosts, SNMP, k8s NodePorts, HA, etc.)
        additionalScrapeConfigsSecret:
          enabled: true
          name: prometheus-additional-scrape-configs
          key: scrape-configs.yaml
        # Secrets mounted at /etc/prometheus/secrets/<name>/ for credentials_file use
        secrets:
          - ha-bearer-token
          - netbox-api-token
        # Allow ServiceMonitors/PodMonitors/PrometheusRules from any namespace
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
      ingress:
        enabled: false

    # Grafana configuration
    grafana:
      enabled: true
      # Pinned to xsvr2 alongside Prometheus/Alertmanager — see prometheus.
      # prometheusSpec above for why. Limit sized above observed usage
      # (485Mi via `kubectl top`).
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 768Mi
      tolerations:
        - key: node-role.kubernetes.io/ha-only
          operator: Equal
          value: reserved
          effect: NoSchedule
        # xsvr2 is ALSO a control-plane node and already carries this
        # taint — see descheduler's helmrelease for the full explanation.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/ha-only
                    operator: In
                    values:
                      - reserved
      persistence:
        enabled: true
        storageClassName: longhorn-retain
        size: 5Gi
      # Longhorn PVC is ReadWriteOnce and single-replica, so a RollingUpdate deadlocks:
      # the new pod can't mount the volume until the old pod releases it, but the old
      # pod won't terminate until the new one is Ready. Recreate avoids the deadlock.
      deploymentStrategy:
        type: Recreate
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      envFromSecret: grafana-oauth-secret
      grafana.ini:
        server:
          domain: grafana.xrs444.net
          root_url: https://grafana.xrs444.net/
        security:
          # Grafana sends X-Frame-Options: deny by default, blocking iframe
          # embedding (e.g. a Home Assistant dashboard card). Safe to allow
          # here since grafana-lan-only already restricts who can load the
          # page at all (LAN/Tailscale only, no public internet).
          allow_embedding: true
        auth:
          disable_login_form: false
          oauth_auto_login: false
        auth.anonymous:
          # Anonymous access is org-wide in Grafana (can't be scoped to one
          # dashboard) — LAN-only exposure is enforced instead by the
          # grafana-lan-only Traefik middleware on ingressroute-grafana.yaml.
          enabled: true
          org_name: "Main Org."
          org_role: Viewer
          hide_version: true
        auth.generic_oauth:
          enabled: true
          name: Kanidm
          client_id: oauth2_grafana
          client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: openid profile email groups
          auth_url: https://idm.xrs444.net/ui/oauth2
          token_url: https://idm.xrs444.net/oauth2/token
          api_url: https://idm.xrs444.net/oauth2/openid/oauth2_grafana/userinfo
          use_pkce: true
          role_attribute_path: "contains(groups[*], 'grafana-admin') && 'Admin' || contains(groups[*], 'grafana') && 'Viewer' || 'Viewer'"
          allow_sign_up: true
      # The chart's sidecar already provisions a default Prometheus datasource.
      # Only add Loki here to avoid a duplicate-default conflict.
      additionalDataSources:
        - name: Loki
          type: loki
          url: https://loki.xrs444.net
          uid: "000000002"
          jsonData:
            maxLines: 1000
            timeout: 60
      # Sidecar loads ConfigMaps labelled grafana_dashboard=1 from all namespaces
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          provider:
            disableDelete: false
            allowUiUpdates: true
      ingress:
        enabled: false

    # Alertmanager configuration
    alertmanager:
      alertmanagerSpec:
        # Pinned to xsvr2 alongside Prometheus/Grafana — see prometheus.
        # prometheusSpec above for why. Only had a 200Mi request before
        # (no limit); this is the thing that has to survive to actually
        # page about a memory-pressure event elsewhere in the cluster.
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            cpu: 200m
            memory: 512Mi
        tolerations:
          - key: node-role.kubernetes.io/ha-only
            operator: Equal
            value: reserved
            effect: NoSchedule
          # xsvr2 is ALSO a control-plane node and already carries this
          # taint — see descheduler's helmrelease for the full explanation.
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/ha-only
                      operator: In
                      values:
                        - reserved
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-retain
              resources:
                requests:
                  storage: 2Gi
        # Alertmanager config is stored in sealedsecret-alertmanager-config.yaml.
        # Full config (routing, receivers, Windmill webhook token) lives there.
        # See secret-alertmanager-config.secret.yaml for the plaintext template.
        # NOTE: configSecret belongs under alertmanagerSpec, not as a sibling of
        # it — a sibling-level configSecret is silently ignored by the chart and
        # Alertmanager falls back to its auto-generated default config secret
        # (alertmanager-<name>), which is what happened here until 2026-07-10.
        configSecret: alertmanager-config
      ingress:
        enabled: false

    # Windmill-specific alert rules
    additionalPrometheusRulesMap:
      windmill-rules:
        groups:
          - name: windmill
            rules:
              - alert: WindmillWorkerDown
                expr: up{job="windmill"} == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Windmill unreachable"
                  description: "Prometheus cannot scrape windmill metrics endpoint for 5 minutes."
