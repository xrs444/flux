---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config-template
  namespace: monitoring
data:
  # Template — @SNMP_COMMUNITY@ is substituted by the init container using
  # the value from the snmp-community Secret before the exporter starts.
  snmp.yml.template: |
    auths:
      snmp_community:
        community: @SNMP_COMMUNITY@
        security_level: noAuthNoPriv
        auth_protocol: MD5
        priv_protocol: DES
        version: 2

      # Shared read-only SNMPv3 credentials for any device that is v1/v3-only
      # (no v2c support) — first consumer is xups.lan (Eaton SPX2200, only
      # offers v1 or v3 in its network card's SNMP settings). Reuse this same
      # auth for any future v1/v3-only device rather than minting a new one
      # per device, matching the single shared snmp_community above.
      snmpv3_ro:
        version: 3
        security_level: authPriv
        username: @SNMPV3_RO_USERNAME@
        auth_protocol: SHA
        password: @SNMPV3_RO_AUTH_PASSWORD@
        priv_protocol: AES
        priv_password: @SNMPV3_RO_PRIV_PASSWORD@

    modules:
      if_mib:
        walk:
          - 1.3.6.1.2.1.2.2       # ifTable
          - 1.3.6.1.2.1.31.1.1    # ifXTable
        get:
          - 1.3.6.1.2.1.1.3.0     # sysUpTime
          - 1.3.6.1.2.1.1.5.0     # sysName
        metrics:
          - name: sysUpTime
            oid: 1.3.6.1.2.1.1.3
            type: gauge
            help: "Time since last re-initialization (hundredths of a second)."

          - name: ifAdminStatus
            oid: 1.3.6.1.2.1.2.2.1.7
            type: gauge
            help: "Desired state of the interface. 1=up 2=down 3=testing"
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString

          - name: ifOperStatus
            oid: 1.3.6.1.2.1.2.2.1.8
            type: gauge
            help: >-
              Operational state. 1=up 2=down 3=testing 4=unknown
              5=dormant 6=notPresent 7=lowerLayerDown
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString

          - name: ifInOctets
            oid: 1.3.6.1.2.1.2.2.1.10
            type: counter
            help: "Total octets received on the interface (32-bit)."
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString

          - name: ifOutOctets
            oid: 1.3.6.1.2.1.2.2.1.16
            type: counter
            help: "Total octets transmitted on the interface (32-bit)."
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString

          - name: ifInErrors
            oid: 1.3.6.1.2.1.2.2.1.14
            type: counter
            help: "Inbound packets containing errors."
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString

          - name: ifOutErrors
            oid: 1.3.6.1.2.1.2.2.1.20
            type: counter
            help: "Outbound packets not transmitted due to errors."
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString

          - name: ifHCInOctets
            oid: 1.3.6.1.2.1.31.1.1.1.6
            type: counter
            help: "Total octets received on the interface (64-bit)."
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString

          - name: ifHCOutOctets
            oid: 1.3.6.1.2.1.31.1.1.1.10
            type: counter
            help: "Total octets transmitted on the interface (64-bit)."
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString

      # RFC1628 UPS-MIB — standard across vendors (Eaton SPX2200 network card
      # supports it alongside its proprietary XUPS-MIB). Single-line/single-phase
      # UPS, so input/output tables only ever have one row (index 1).
      ups:
        walk:
          - 1.3.6.1.2.1.33.1.2   # upsBattery group
          - 1.3.6.1.2.1.33.1.3   # upsInput group
          - 1.3.6.1.2.1.33.1.4   # upsOutput group
          - 1.3.6.1.2.1.33.1.6   # upsAlarm group
        get:
          - 1.3.6.1.2.1.1.5.0     # sysName
          - 1.3.6.1.2.1.33.1.1.1.0 # upsIdentManufacturer
          - 1.3.6.1.2.1.33.1.1.2.0 # upsIdentModel
        metrics:
          - name: upsBatteryStatus
            oid: 1.3.6.1.2.1.33.1.2.1
            type: gauge
            help: "Battery status. 1=unknown 2=normal 3=low 4=depleted"

          - name: upsSecondsOnBattery
            oid: 1.3.6.1.2.1.33.1.2.2
            type: gauge
            help: "Seconds currently running on battery power. 0 if on mains."

          - name: upsEstimatedMinutesRemaining
            oid: 1.3.6.1.2.1.33.1.2.3
            type: gauge
            help: "Estimated runtime remaining on battery, in minutes."

          - name: upsEstimatedChargeRemaining
            oid: 1.3.6.1.2.1.33.1.2.4
            type: gauge
            help: "Estimated battery charge remaining, percent of full charge."

          - name: upsBatteryVoltage
            oid: 1.3.6.1.2.1.33.1.2.5
            type: gauge
            help: "Battery voltage, in 0.1V DC units."

          - name: upsBatteryTemperature
            oid: 1.3.6.1.2.1.33.1.2.7
            type: gauge
            help: "Battery temperature, degrees Celsius."

          - name: upsInputFrequency
            oid: 1.3.6.1.2.1.33.1.3.3.1.2
            type: gauge
            help: "Input line frequency, in 0.1Hz units."
            indexes:
              - labelname: upsInputLineIndex
                type: gauge

          - name: upsInputVoltage
            oid: 1.3.6.1.2.1.33.1.3.3.1.3
            type: gauge
            help: "Input line voltage, in RMS volts."
            indexes:
              - labelname: upsInputLineIndex
                type: gauge

          - name: upsOutputSource
            oid: 1.3.6.1.2.1.33.1.4.1
            type: gauge
            help: >-
              Output power source. 1=other 2=none 3=normal 4=bypass
              5=battery 6=booster 7=reducer
              (5=battery is the "on battery, mains lost" state to alert on)

          - name: upsOutputFrequency
            oid: 1.3.6.1.2.1.33.1.4.2
            type: gauge
            help: "Output frequency, in 0.1Hz units."

          - name: upsOutputVoltage
            oid: 1.3.6.1.2.1.33.1.4.4.1.2
            type: gauge
            help: "Output line voltage, in RMS volts."
            indexes:
              - labelname: upsOutputLineIndex
                type: gauge

          - name: upsOutputPercentLoad
            oid: 1.3.6.1.2.1.33.1.4.4.1.5
            type: gauge
            help: "Output load, percent of rated capacity."
            indexes:
              - labelname: upsOutputLineIndex
                type: gauge

          - name: upsAlarmsPresent
            oid: 1.3.6.1.2.1.33.1.6.1
            type: gauge
            help: "Number of active alarm conditions on the UPS."
