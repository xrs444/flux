---
# Blackbox HTTP probe for xcog1's LiteLLM front door (family-agent LLM host).
# Uses the existing http_2xx module in configmap-blackbox.yaml. LiteLLM's own
# /metrics callback is enterprise-gated in current releases (plan §D3), so
# liveliness is checked via blackbox instead. Endpoint returns 200 with no
# auth required. The probe result feeds into the Xcog1LiteLLMDown alert rule.
# Uses xcog1.lan, not a pinned IP (2026-10-02 correction): a prior comment
# here claimed xcog1.lan round-robinned across 3 A records (LAN + Tailscale)
# and pinned 172.20.1.130 to work around it. Re-checked live via
# `kubectl run --rm -i busybox -- nslookup xcog1.lan` from inside this same
# cluster — it returns exactly one A and one AAAA record, no Tailscale
# address, no ambiguity. That justification didn't hold up, and a pinned IP
# would silently break the next time xcog1's address changes (e.g. a VLAN
# move) with nothing to catch it. If this probe starts failing
# non-deterministically again, re-verify with the same nslookup before
# reaching for another IP pin as the fix.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: xcog1-litellm
  namespace: monitoring
  labels:
    app: blackbox
    release: kube-prometheus-stack
spec:
  interval: 1m
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        - http://xcog1.lan:4000/health/liveliness
      labels:
        job: blackbox-xcog1-litellm
