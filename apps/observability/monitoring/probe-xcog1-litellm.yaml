---
# Blackbox HTTP probe for xcog1's LiteLLM front door (family-agent LLM host).
# Uses the existing http_2xx module in configmap-blackbox.yaml. LiteLLM's own
# /metrics callback is enterprise-gated in current releases (plan §D3), so
# liveliness is checked via blackbox instead. Endpoint returns 200 with no
# auth required. The probe result feeds into the Xcog1LiteLLMDown alert rule.
# Pinned to 172.20.1.130 (not xcog1.lan): the hostname round-robins across 3
# A records (xcog1 is multi-homed — LAN + Tailscale), and only .130 is
# actually reachable from the cluster's pod network — confirmed live via
# `kubectl run --rm -i busybox -- nc -zv <ip> 4000` against each address;
# the other two time out. Using the bare hostname made the probe fail
# non-deterministically depending on which A record got resolved.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: xcog1-litellm
  namespace: monitoring
  labels:
    app: blackbox
    release: kube-prometheus-stack
spec:
  interval: 1m
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        - http://172.20.1.130:4000/health/liveliness
      labels:
        job: blackbox-xcog1-litellm
