# Shared namespace for read-only MCP servers consumed by Hermes (t/s/k).
# Reduces RBAC surface: one ServiceAccount per tool, all bound to strictly
# read-only ClusterRoles. Hermes reaches each MCP over ClusterIP DNS at
# <name>.mcp-tools.svc.cluster.local.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-tools
  labels:
    # Network-segmentation project, T1 onboarding. See
    # infrastructure/configs/network-policies/ for the baselines this
    # activates, and ciliumnetworkpolicy-{mcp-prometheus,mcp-loki,
    # mcp-kubernetes}.yaml for app-specific rules.
    netpol.homeprod/enforce: "true"
