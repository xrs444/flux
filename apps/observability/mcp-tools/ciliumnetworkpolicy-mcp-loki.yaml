# Network-segmentation project, T1 onboarding.
#
# Consumed only by hermes-t (hermes-s excludes Loki per its own ConfigMap
# comment: "Loki logs and k8s inspection stay hermes-t-only"). Proxies
# through Grafana (GRAFANA_URL), not a direct Loki dependency — see this
# app's deployment-mcp-loki.yaml header comment.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-loki
  namespace: mcp-tools
spec:
  endpointSelector:
    matchLabels:
      app: mcp-loki
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-t
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
