# mcp-loki — HTTP MCP server exposing LogQL query tools to Hermes.
#
# Implementation note: uses grafana/mcp-grafana (the official Grafana MCP)
# scoped to just Loki tools via --enabled-tools=loki. scottlepp/loki-mcp
# was evaluated but does not publish a container image and only supports
# SSE transport; mcp-grafana is actively maintained by Grafana Labs,
# publishes to Docker Hub, and supports streamable-http natively.
#
# Because it proxies through Grafana, the Loki data source in Grafana is
# the actual backend — this leverages the Loki datasource that's already
# configured for dashboards. No direct Loki service dependency beyond that.
#
# Tools provided (Loki category only):
#   - query_loki_logs             (LogQL query / query_range)
#   - list_loki_label_names
#   - list_loki_label_values
#   - query_loki_stats
#
# Renovate: image tag pinned to a specific version; kubernetes manager
# picks up updates. Loki-specific behaviour: minor grafana/mcp-grafana
# updates could change tool contracts, so this image is on the MCP
# review-required rule in renovate.json.
#
# --allowed-hosts=*: mcp-grafana >=0.17.1 enforces a Host-header allowlist
# on the streamable-http transport (default: loopback of --address only),
# returning 403 on every route including /healthz. That breaks kubelet
# probes and Service traffic, which hit the pod by ClusterIP, not
# localhost. Wildcarding it is safe here because the Service is
# ClusterIP-only with no Ingress (bug-567).
#
# MCP_GRAFANA_SERVER_TOKEN: mcp-grafana >=1.1.0 logs a SECURITY warning on
# every non-loopback bind with no caller auth ("Anyone who can reach this
# address can invoke MCP tools..."), and the PR that introduced it
# (grafana/mcp-grafana#1059) originally made this a hard startup failure
# before being softened to a warning-only default the same day (#1060) —
# there's no changelog/issue signal for when (or whether) it becomes a
# hard failure again, so added proactively 2026-11-11 rather than waiting.
# Only hermes-t calls this server (ciliumnetworkpolicy-mcp-loki.yaml), and
# its MCP client config now sends this same token as a bearer header — see
# apps/automation/hermes-t/configmap-hermes-t-config.yaml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-loki
  namespace: mcp-tools
  labels:
    app: mcp-loki
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mcp-loki
  template:
    metadata:
      labels:
        app: mcp-loki
    spec:
      containers:
        - name: mcp-loki
          image: docker.io/grafana/mcp-grafana:2.3.0-alpine
          args:
            - --transport=streamable-http
            - --address=0.0.0.0:8080
            - --enabled-tools=loki
            - --allowed-hosts=*
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GRAFANA_URL
              value: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local"
            - name: GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: admin-user
            - name: GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: admin-password
            - name: MCP_GRAFANA_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-grafana-credentials
                  key: server-auth-token
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
