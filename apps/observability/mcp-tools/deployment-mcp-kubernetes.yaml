# mcp-kubernetes — HTTP MCP server exposing read-only k8s inspection tools.
#
# Tools provided (per manusa/kubernetes-mcp-server):
#   - configuration_view / contexts_list
#   - resources_list / resources_get / resources_describe / resources_delete
#     (delete blocked by RBAC — see clusterrole-mcp-kubernetes.yaml)
#   - pods_list / pods_get / pods_log / pods_top / pods_run
#   - events_list
#   - helm_list, helm_install (Helm tools present but write ops blocked by RBAC)
#
# Enforcement: this ServiceAccount cannot mutate anything the ClusterRole
# doesn't grant — verbs are get/list/watch only. Even if the image exposes
# a mutating tool, the API call fails at kube-apiserver.
#
# Renovate: image tag pinned; on MCP review-required rule in renovate.json
# because tool contracts can shift.
#
# No caller bearer-auth here (checked 2026-11-11 alongside mcp-loki's fix
# for mcp-grafana's startup SECURITY warning): ghcr.io/containers/
# kubernetes-mcp-server only offers full OAuth/OIDC for caller auth
# (Keycloak/Entra ID docs), not a lightweight bearer-token flag — wiring
# that up would need a Kanidm OIDC client, a bigger lift than this pass
# covers. Same exposure as mcp-loki had (0.0.0.0:8080, no caller auth,
# plus the read-only RBAC ClusterRole), mitigated the same way:
# ciliumnetworkpolicy-mcp-kubernetes.yaml restricts ingress to hermes-t
# only, ClusterIP-only, no Ingress. Worth a follow-up if the cluster ever
# needs stronger isolation here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-kubernetes
  namespace: mcp-tools
  labels:
    app: mcp-kubernetes
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mcp-kubernetes
  template:
    metadata:
      labels:
        app: mcp-kubernetes
    spec:
      serviceAccountName: mcp-kubernetes
      containers:
        - name: mcp-kubernetes
          image: ghcr.io/containers/kubernetes-mcp-server:v0.1.2
          # v0.1.0+ dropped all runtime CLI flags (--port/--log-level/
          # --read-only) in favor of a single TOML config file — see
          # configmap-mcp-kubernetes.yaml, mounted below over the image's
          # own default config at this same path.
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server/config.toml
              subPath: config.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mcp-kubernetes-config
