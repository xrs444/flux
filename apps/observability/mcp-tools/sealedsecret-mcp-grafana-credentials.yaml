# SealedSecret for mcp-loki's caller-auth bearer token.
#
# History: this file originally scaffolded an `api-key` for a direct
# Grafana service-account token, but that approach was replaced by basic
# auth via the reflected grafana-admin-secret (commit 64ddd696) before this
# file was ever added to kustomization.yaml or applied — `kubectl get
# secret mcp-grafana-credentials -n mcp-tools` returns NotFound. Repurposed
# 2026-11-11 to hold the --server-auth-token / MCP_GRAFANA_SERVER_TOKEN
# value instead (see deployment-mcp-loki.yaml header for why).
#
# The same raw token value must also be sealed into
# apps/automation/hermes-t/sealedsecret-hermes-t-config.yaml under
# MCP_GRAFANA_SERVER_TOKEN (hermes-t is the only consumer, per
# ciliumnetworkpolicy-mcp-loki.yaml) — SealedSecrets are bound to a single
# namespace+name+key, so a value shared across namespaces has to be sealed
# once per destination secret:
#   TOKEN=$(openssl rand -hex 32)
#   printf '%s' "$TOKEN" | kubeseal --raw --scope strict \
#     --controller-name=sealed-secrets --controller-namespace=sealed-secrets \
#     --namespace mcp-tools --name mcp-grafana-credentials \
#     --from-file=server-auth-token=/dev/stdin
#   printf '%s' "$TOKEN" | kubeseal --raw --scope strict \
#     --controller-name=sealed-secrets --controller-namespace=sealed-secrets \
#     --namespace hermes-t --name hermes-t-config \
#     --from-file=MCP_GRAFANA_SERVER_TOKEN=/dev/stdin
# yamllint disable rule:line-length
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mcp-grafana-credentials
  namespace: mcp-tools
spec:
  encryptedData:
    server-auth-token: 
  template:
    metadata:
      name: mcp-grafana-credentials
      namespace: mcp-tools
    type: Opaque
