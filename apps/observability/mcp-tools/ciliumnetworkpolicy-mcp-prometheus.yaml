# Network-segmentation project, T1 onboarding.
#
# Consumed directly by hermes-t and hermes-s (both register mcp-prometheus;
# hermes-s is scoped to it only — see hermes-s's own ConfigMap comment).
# No IngressRoute in this namespace — Hermes reaches this over ClusterIP
# DNS, per namespace.yaml's own header comment. No mcpjungle egress rule
# needed: mcpjungle registers a disjoint set of servers (netbox/scanopy/
# omada/firewalla/homeassistant/nodered/nixos), never these.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-prometheus
  namespace: mcp-tools
spec:
  endpointSelector:
    matchLabels:
      app: mcp-prometheus
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-t
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-s
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
