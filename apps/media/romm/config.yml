---
# RomM configuration file
#
# NOT a Kubernetes resource. Place manually in the romm-config PVC:
#   kubectl cp flux/apps/romm/config.yml \
#     romm/<pod>:/romm/config/config.yml
#
# Omitted sections use RomM's built-in defaults.

system:
  platforms:
    # Maps the 'dos' library folder to the MS-DOS IGDB platform slug.
    dos: "dos"
    # PS1 IGDB slug changed to 'psx' as of RomM 4.1.0 (was 'ps').
    ps1: "psx"
    # Friendlier folder name than the IGDB slug 'win'. Catalog-only in RomM —
    # no EmulatorJS core for Windows PC games, download to play on a PC.
    pc: "win"
    # Unverified against this instance — confirm under Settings > Platforms
    # after the first scan and fix this mapping if RomM reports differently.
    # Catalog-only, same as pc (no EmulatorJS core for original Xbox).
    xbox: "xbox"

exclude:
  roms:
    multi_file:
      # Prevent ROMM scanning the CD/ disc-image subfolder as a game entry.
      names:
        - CD

scan:
  priority:
    metadata:
      - igdb
      - mobygames
    artwork:
      - igdb
      - mobygames
