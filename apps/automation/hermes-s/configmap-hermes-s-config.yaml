---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-s-config
  namespace: hermes-s
data:
  config.yaml: |
    # xcog1 (Mac Mini) LiteLLM front door — local qwen3-30b-a3b via mlx-lm.
    # provider: custom is hermes-agent's generic OpenAI-compatible slot;
    # api_key uses ${VAR} env interpolation (same mechanism as
    # MCP_MCPJUNGLE_API_KEY below), resolved from LITELLM_MASTER_KEY at
    # runtime — verified live against config.py's _expand_env_vars, which
    # applies to any string value in config.yaml, not just mcp headers.
    model:
      default: qwen3-30b-a3b
      provider: custom
      base_url: http://xcog1.lan:4000/v1
      api_key: "${LITELLM_MASTER_KEY}"

    terminal:
      backend: local

    memory:
      memory_enabled: true
      backend: hindsight
      hindsight:
        mode: local_external
        api_url: http://hindsight.hindsight.svc.cluster.local:8888
        bank_id: hermes-s

    # Only mcp-prometheus — Hermes-S is scoped to basic non-sensitive
    # metrics for triaging voice/UX regressions (see
    # flux/apps/observability/mcp-tools/kustomization.yaml). Loki logs and
    # k8s inspection stay hermes-t-only; verified /mcp path against the
    # live pod, same as hermes-t.
    mcp_servers:
      mcp-prometheus:
        url: http://mcp-prometheus.mcp-tools.svc.cluster.local:8080/mcp
        enabled: true

      # Personal-scope MCPs (flux/apps/automation/mcp-personal/): samantha's
      # own Vikunja tasks and Radicale calendar/contacts, read-write. No
      # auth header — the credential lives with the MCP pod, not hermes.
      # NOT the -t variants — that isolation is enforced per-server by
      # credential (Vikunja token owner, Radicale principal) and by network
      # (Cilium CNP restricts each Service's ingress to this namespace
      # only, see ../mcp-personal/ciliumnetworkpolicy-mcp-{vikunja,caldav}-
      # s.yaml). Same bug-895 caveat as hermes-t's ConfigMap: this seeds a
      # rebuilt PVC only, applied live via `hermes mcp add` too.
      #
      # CalDAV caveat: mcp-caldav-s's list-calendars tool is blind to
      # samantha/ and family/ (Radicale derives calendar-home-set from the
      # authenticated hermes-s principal, not from rights grants) — real
      # collection URLs are pinned into /opt/data/MEMORY.md instead, same
      # reasoning as hermes-t's ConfigMap comment.
      mcp-vikunja-s:
        url: http://mcp-vikunja-s.mcp-personal.svc.cluster.local:8080/mcp
        enabled: true
      mcp-caldav-s:
        url: http://mcp-caldav-s.mcp-personal.svc.cluster.local:8080/mcp
        enabled: true

  # Top-level keys git enforces on EVERY pod start, merged over the live
  # /opt/data/config.yaml by the seed-config initContainer's second step
  # (shallow, top-level-key overwrite only — see deployment-hermes-s.yaml).
  # bug-956 (2026-09-16): the model/terminal/memory blocks above were
  # declared in config.yaml but never reached the running pod (copy-if-
  # missing seeding, bug-895) — hermes-s had no model configured live and
  # was silently falling back to deepseek-v4-pro. Values match the blocks
  # above verbatim.
  config-managed.yaml: |
    model:
      default: qwen3-30b-a3b
      provider: custom
      base_url: http://xcog1.lan:4000/v1
      api_key: "${LITELLM_MASTER_KEY}"

    terminal:
      backend: local

    memory:
      memory_enabled: true
      backend: hindsight
      hindsight:
        mode: local_external
        api_url: http://hindsight.hindsight.svc.cluster.local:8888
        bank_id: hermes-s
