---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-s
  namespace: hermes-s
  labels:
    app: hermes-s
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-s
  template:
    metadata:
      labels:
        app: hermes-s
    spec:
      securityContext:
        fsGroup: 10000
      initContainers:
        # ConfigMap volumes are always mounted read-only by Kubernetes, even
        # with subPath. hermes writes its own config.yaml back to disk when
        # the dashboard toggles state (e.g. enabling a plugin), so the
        # ConfigMap can only ever be a one-time seed onto the writable PVC,
        # never the live mount. Copy-if-missing keeps the ConfigMap as the
        # source of truth for the *initial* config without clobbering
        # in-place edits hermes makes afterward. (bug-895)
        #
        # Step 2 (bug-956 fix, mirrors hermes-t): a shallow, top-level-key
        # merge of config-managed.yaml on TOP of whatever's on the PVC,
        # every pod start — idempotent. Without this, hermes-s had no
        # model configured live despite the ConfigMap declaring one, and
        # was silently falling back to deepseek-v4-pro.
        #
        # Step 0 (bug-957 follow-up, 2026-09-16): chown /opt/data to
        # hermes:hermes — see the identical, fuller comment in
        # deployment-hermes-t.yaml. The PVC's primary owner is root;
        # fsGroup only ever grants GROUP access, and hermes_cli/auth.py's
        # own chmod 700 on every credential refresh strips exactly that,
        # locking out anything that isn't the primary owner. Idempotent,
        # non-recursive, runs as root (initContainer default).
        - name: seed-config
          image: nousresearch/hermes-agent:v2026.8.31
          command:
            - sh
            - -c
            - |
              set -e
              chown hermes:hermes /opt/data
              [ -f /opt/data/config.yaml ] || cp /opt/config-seed/config.yaml /opt/data/config.yaml
              /opt/hermes/.venv/bin/python - <<'PY'
              import yaml
              with open("/opt/data/config.yaml") as f:
                  live = yaml.safe_load(f) or {}
              with open("/opt/config-seed/config-managed.yaml") as f:
                  managed = yaml.safe_load(f) or {}
              live.update(managed)
              with open("/opt/data/config.yaml", "w") as f:
                  yaml.safe_dump(live, f, sort_keys=False)
              PY
          volumeMounts:
            - name: hermes-s-data
              mountPath: /opt/data
            - name: hermes-s-config
              mountPath: /opt/config-seed
      containers:
        - name: hermes-s
          image: nousresearch/hermes-agent:v2026.8.31
          command: ["sh", "-c", "hermes dashboard --host 0.0.0.0 & exec hermes gateway run"]
          ports:
            - containerPort: 8642
              name: gateway
            - containerPort: 9119
              name: dashboard
          env:
            - name: TZ
              value: "America/Phoenix"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes-s.xrs444.net"
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: "https://idm.xrs444.net/oauth2/openid/oauth2_hermes_s"
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: "oauth2_hermes_s"
            - name: HINDSIGHT_MODE
              value: "local_external"
            - name: HINDSIGHT_API_URL
              value: "http://hindsight.hindsight.svc.cluster.local:8888"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-s-config
                  key: DEEPSEEK_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-s-config
                  key: LITELLM_MASTER_KEY
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-s-config
                  key: OIDC_CLIENT_SECRET
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-s-config
                  key: API_SERVER_KEY
            - name: MATRIX_HOMESERVER
              value: "http://synapse.matrix.svc.cluster.local:8008"
            - name: MATRIX_E2EE_MODE
              value: "optional"
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-s-config
                  key: MATRIX_ACCESS_TOKEN
            - name: MATRIX_RECOVERY_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-s-config
                  key: MATRIX_RECOVERY_KEY
          volumeMounts:
            - name: hermes-s-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: hermes-s-data
          persistentVolumeClaim:
            claimName: hermes-s-data
        - name: hermes-s-config
          configMap:
            name: hermes-s-config
            items:
              - key: config.yaml
                path: config.yaml
              - key: config-managed.yaml
                path: config-managed.yaml
