---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-k
  namespace: hermes-k
  labels:
    app: hermes-k
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-k
  template:
    metadata:
      labels:
        app: hermes-k
    spec:
      securityContext:
        # Same fsGroup pattern as hermes-t / hermes-s per the Longhorn
        # non-root container gotcha in .wolf/cerebrum.md.
        fsGroup: 10000
      initContainers:
        # ConfigMap volumes are always mounted read-only by Kubernetes, even
        # with subPath. hermes writes its own config.yaml back to disk when
        # the dashboard toggles state (e.g. enabling a plugin), so the
        # ConfigMap can only ever be a one-time seed onto the writable PVC,
        # never the live mount. Copy-if-missing keeps the ConfigMap as the
        # source of truth for the *initial* config without clobbering
        # in-place edits hermes makes afterward. (bug-895)
        #
        # Step 2 (bug-956/bug-957 fix, mirrors hermes-t): a shallow,
        # top-level-key merge of config-managed.yaml on TOP of whatever's
        # on the PVC, every pod start — idempotent. hermes-k had it worst:
        # its /opt/data lost its group-write bits (bug-957 — see the chown
        # step below for the actual mechanism), so config.yaml sat at 0
        # bytes, root-owned, since 2026-07-10 — this merge is also what
        # backfills a genuinely empty base config now that's fixed.
        #
        # Step 0 (bug-957, full root cause found 2026-09-16): chown
        # /opt/data to hermes:hermes — see the fuller comment in
        # deployment-hermes-t.yaml. The PVC's primary owner is root;
        # fsGroup only ever grants GROUP access, and hermes_cli/auth.py's
        # own `chmod 700` on every credential refresh strips exactly that,
        # locking out anything that isn't the primary owner — this is what
        # left config.yaml empty in the first place, not a one-off fsGroup
        # fixup miss. Idempotent, non-recursive, runs as root (initContainer
        # default).
        - name: seed-config
          image: nousresearch/hermes-agent:v2026.9.14
          command:
            - sh
            - -c
            - |
              set -e
              chown hermes:hermes /opt/data
              [ -f /opt/data/config.yaml ] || cp /opt/config-seed/config.yaml /opt/data/config.yaml
              /opt/hermes/.venv/bin/python - <<'PY'
              import yaml
              with open("/opt/data/config.yaml") as f:
                  live = yaml.safe_load(f) or {}
              with open("/opt/config-seed/config-managed.yaml") as f:
                  managed = yaml.safe_load(f) or {}
              live.update(managed)
              with open("/opt/data/config.yaml", "w") as f:
                  yaml.safe_dump(live, f, sort_keys=False)
              PY
          volumeMounts:
            - name: hermes-k-data
              mountPath: /opt/data
            - name: hermes-k-config
              mountPath: /opt/config-seed
      containers:
        - name: hermes-k
          image: nousresearch/hermes-agent:v2026.9.14
          command: ["hermes", "gateway", "run"]
          ports:
            - containerPort: 8642
              name: gateway
            - containerPort: 9119
              name: dashboard
          env:
            - name: TZ
              value: "America/Phoenix"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes-k.xrs444.net"
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: "https://idm.xrs444.net/oauth2/openid/oauth2_hermes_k"
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: "oauth2_hermes_k"
            - name: HINDSIGHT_MODE
              value: "local_external"
            - name: HINDSIGHT_API_URL
              value: "http://hindsight.hindsight.svc.cluster.local:8888"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-k-config
                  key: DEEPSEEK_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-k-config
                  key: LITELLM_MASTER_KEY
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-k-config
                  key: OIDC_CLIENT_SECRET
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-k-config
                  key: API_SERVER_KEY
          volumeMounts:
            - name: hermes-k-data
              mountPath: /opt/data
          resources:
            # Lower ceiling than hermes-t/s: kid-mode is short-turn interaction,
            # not agent loops. Bound cost, bound blast radius.
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: hermes-k-data
          persistentVolumeClaim:
            claimName: hermes-k-data
        - name: hermes-k-config
          configMap:
            name: hermes-k-config
            items:
              - key: config.yaml
                path: config.yaml
              - key: config-managed.yaml
                path: config-managed.yaml
