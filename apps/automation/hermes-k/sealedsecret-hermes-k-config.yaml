# SealedSecret for hermes-k. Sealed against the sealed-secrets controller
# in-cluster — only that controller can decrypt encryptedData below.
# Keys: API_SERVER_KEY (random), DEEPSEEK_API_KEY (household key, shared
# with hermes-t/hermes-s; kept for now, remove once xcog1 cutover is
# verified end-to-end), OIDC_CLIENT_SECRET (Kanidm oauth2_hermes_k secret,
# matches nix/secrets/kanidm_oauth2_secrets.yaml), LITELLM_MASTER_KEY
# (household LiteLLM master key on xcog1 — Phase B cutover, kid policy:
# hermes-k gets local qwen3-30b-a3b ONLY, never the deepseek-hard alias).
# yamllint disable rule:line-length
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hermes-k-config
  namespace: hermes-k
spec:
  encryptedData:
    API_SERVER_KEY: 
    DEEPSEEK_API_KEY: 
    OIDC_CLIENT_SECRET: 
    LITELLM_MASTER_KEY: 
  template:
    metadata:
      name: hermes-k-config
      namespace: hermes-k
