---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-t
  namespace: hermes-t
  labels:
    app: hermes-t
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-t
  template:
    metadata:
      labels:
        app: hermes-t
    spec:
      securityContext:
        fsGroup: 10000
      initContainers:
        # ConfigMap volumes are always mounted read-only by Kubernetes, even
        # with subPath. hermes writes its own config.yaml back to disk when
        # the dashboard toggles state (e.g. enabling a plugin), so the
        # ConfigMap can only ever be a one-time seed onto the writable PVC,
        # never the live mount. Copy-if-missing keeps the ConfigMap as the
        # source of truth for the *initial* config without clobbering
        # in-place edits hermes makes afterward. (bug-895)
        #
        # Step 2 (added for the Hermes-T Kanban plan / bug-936 follow-up):
        # a shallow, top-level-key merge of config-managed.yaml on TOP of
        # whatever's on the PVC, every pod start — idempotent and safe to
        # run against an already-merged file. This is how a key like
        # `toolsets:` can be git-enforced without falling back into
        # bug-936 (the copy-if-missing step alone means config.yaml's
        # contents stop applying the moment /opt/data/config.yaml exists).
        # Only keys present in config-managed.yaml are touched; every other
        # top-level key (dashboard, plugins, onboarding, _config_version,
        # platforms, mcp_servers) is left exactly as hermes last wrote it.
        #
        # Step 0 (bug-957 follow-up, 2026-09-16): chown /opt/data to
        # hermes:hermes. The PVC's primary owner is root (whoever/whatever
        # provisions the volume) — Kubernetes' fsGroup only ever changes
        # GROUP ownership, never the primary owner, confirmed live all
        # session (every `stat /opt/data` showed owner=root despite
        # fsGroup being active throughout). hermes_cli/auth.py deliberately
        # `chmod 700`s its own home dir on every credential refresh
        # ("tighten parent dir so siblings can't traverse to creds") — sound
        # for a single-owner deployment, but it strips the GROUP bits
        # fsGroup grants, locking out anything that isn't the primary
        # owner (the dashboard's own hermes-uid process included — this is
        # what broke the /kanban UI with a 500, confirmed live). Making
        # hermes the actual owner means that chmod becomes harmless: the
        # owner still has full access no matter what group bits say.
        # Idempotent (a no-op chown once already correct), runs as root
        # (initContainer default), non-recursive — fsGroup's own fixup
        # already granted correct group ownership recursively at mount
        # time; only the top-level directory's owner was ever wrong.
        - name: seed-config
          image: nousresearch/hermes-agent:v2026.8.31
          command:
            - sh
            - -c
            - |
              set -e
              chown hermes:hermes /opt/data
              [ -f /opt/data/config.yaml ] || cp /opt/config-seed/config.yaml /opt/data/config.yaml
              /opt/hermes/.venv/bin/python - <<'PY'
              import yaml
              with open("/opt/data/config.yaml") as f:
                  live = yaml.safe_load(f) or {}
              with open("/opt/config-seed/config-managed.yaml") as f:
                  managed = yaml.safe_load(f) or {}
              live.update(managed)
              with open("/opt/data/config.yaml", "w") as f:
                  yaml.safe_dump(live, f, sort_keys=False)
              PY
          volumeMounts:
            - name: hermes-t-data
              mountPath: /opt/data
            - name: hermes-t-config
              mountPath: /opt/config-seed
      containers:
        - name: hermes-t
          image: nousresearch/hermes-agent:v2026.8.31
          command: ["sh", "-c", "hermes dashboard --host 0.0.0.0 & exec hermes gateway run"]
          ports:
            - containerPort: 8642
              name: gateway
            - containerPort: 9119
              name: dashboard
          env:
            - name: TZ
              value: "America/Phoenix"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes-t.xrs444.net"
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: "https://idm.xrs444.net/oauth2/openid/oauth2_hermes_t"
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: "oauth2_hermes_t"
            - name: HINDSIGHT_MODE
              value: "local_external"
            - name: HINDSIGHT_API_URL
              value: "http://hindsight.hindsight.svc.cluster.local:8888"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-t-config
                  key: DEEPSEEK_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-t-config
                  key: LITELLM_MASTER_KEY
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-t-config
                  key: OIDC_CLIENT_SECRET
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-t-config
                  key: API_SERVER_KEY
            - name: MCP_MCPJUNGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-t-config
                  key: MCP_MCPJUNGLE_API_KEY
            - name: MATRIX_HOMESERVER
              value: "http://synapse.matrix.svc.cluster.local:8008"
            - name: MATRIX_ALLOWED_USERS
              value: "@xrs444:matrix.xrs444.net"
            - name: MATRIX_E2EE_MODE
              value: "optional"
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-t-config
                  key: MATRIX_ACCESS_TOKEN
            - name: MATRIX_RECOVERY_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-t-config
                  key: MATRIX_RECOVERY_KEY
          volumeMounts:
            - name: hermes-t-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: hermes-t-data
          persistentVolumeClaim:
            claimName: hermes-t-data
        - name: hermes-t-config
          configMap:
            name: hermes-t-config
            items:
              - key: config.yaml
                path: config.yaml
              - key: config-managed.yaml
                path: config-managed.yaml
