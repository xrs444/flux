---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-t-config
  namespace: hermes-t
data:
  config.yaml: |
    # xcog1 (Mac Mini) LiteLLM front door — local qwen3-30b-a3b via mlx-lm.
    # provider: custom is hermes-agent's generic OpenAI-compatible slot;
    # api_key uses ${VAR} env interpolation (same mechanism as
    # MCP_MCPJUNGLE_API_KEY below), resolved from LITELLM_MASTER_KEY at
    # runtime — verified live against config.py's _expand_env_vars, which
    # applies to any string value in config.yaml, not just mcp headers.
    # deepseek-hard escalation tier deliberately NOT wired yet — hermes-agent's
    # model_aliases don't inherit model.api_key via the credential pool
    # (verified live: get_compatible_custom_providers only reads
    # custom_providers:/providers:, not model:), so a naive alias would
    # silently resolve to "no-key-required" and 401 against xcog1's LiteLLM.
    # Needs a proper custom_providers: pool entry — follow-up, not this pass.
    model:
      default: qwen3-30b-a3b
      provider: custom
      base_url: http://xcog1.lan:4000/v1
      api_key: "${LITELLM_MASTER_KEY}"

    terminal:
      backend: local

    memory:
      memory_enabled: true
      backend: hindsight
      hindsight:
        mode: local_external
        api_url: http://hindsight.hindsight.svc.cluster.local:8888
        bank_id: hermes-t

    # Read-only observability MCPs from flux/apps/observability/mcp-tools/.
    # /mcp is the streamable-http path (cluster's MCP transport standard —
    # verified live against the running mcp-prometheus/mcp-loki/mcp-kubernetes
    # pods; see their deployment manifests for tool lists and RBAC scoping).
    # hermes-k never gets this block — kid-mode denies these tools by policy.
    mcp_servers:
      mcp-prometheus:
        url: http://mcp-prometheus.mcp-tools.svc.cluster.local:8080/mcp
        enabled: true
      mcp-loki:
        url: http://mcp-loki.mcp-tools.svc.cluster.local:8080/mcp
        enabled: true
      mcp-kubernetes:
        url: http://mcp-kubernetes.mcp-tools.svc.cluster.local:8080/mcp
        enabled: true

      # mcpjungle: higher-trust MCP gateway (flux/apps/mcpjungle/) fronting
      # Firewalla, Omada, arr, Home Assistant, Jellyfin, NetBox (read-write).
      # Auth is a per-client bearer token (MCPJungle's own enterprise-mode
      # access control, scoped via `mcpjungle create mcp-client hermes-t
      # --allow "firewalla,omada,arr,homeassistant,jellyfin,netbox"`), not
      # Kanidm/oauth2-proxy — verified live against the running hermes-t pod
      # (`hermes mcp add --auth header`, schema confirmed via mcp_tool.py:
      # `headers: {Authorization: "Bearer ${VAR}"}`, `${VAR}` resolved from
      # the MCP_MCPJUNGLE_API_KEY env var, itself sourced from
      # sealedsecret-hermes-t-config.yaml like DEEPSEEK_API_KEY/etc above).
      mcpjungle:
        url: http://mcpjungle.mcp-gateway.svc.cluster.local:8080/mcp
        enabled: true
        auth: header
        headers:
          Authorization: "Bearer ${MCP_MCPJUNGLE_API_KEY}"

      # Personal-scope MCPs (flux/apps/automation/mcp-personal/): xrs444's
      # own Vikunja tasks and Radicale calendar/contacts, read-write. No
      # auth header — the credential (tk_ token / htpasswd password) lives
      # with the MCP pod itself, not with hermes, so there's nothing to add
      # to sealedsecret-hermes-t-config.yaml for these two. Deliberately
      # NOT routed through mcpjungle: its per-client allow-list is
      # per-server-name and can't express "as xrs444, never as samantha" —
      # that isolation is enforced per-server instead, both by credential
      # (Vikunja token owner, Radicale principal) and by network (Cilium
      # CNP restricts each Service's ingress to this namespace only, see
      # ../mcp-personal/ciliumnetworkpolicy-mcp-{vikunja,caldav}-t.yaml).
      #
      # NOTE (bug-895 pattern): adding these lines here does NOT affect a
      # running hermes-t — seed-config is copy-if-missing and
      # /opt/data/config.yaml already exists once seeded. Applied live via
      # `hermes mcp add` as well; this block only seeds a rebuilt PVC.
      #
      # CalDAV caveat: mcp-caldav-t's list-calendars tool is blind to
      # xrs444/ and family/ — Radicale derives calendar-home-set from the
      # authenticated principal (hermes-t), not from rights grants. Every
      # other tool takes an explicit calendarUrl, so the real collection
      # URLs are pinned into /opt/data/MEMORY.md (hermes's built-in,
      # always-active memory file — confirmed live 2026-09-15 that
      # `agent.system_prompt` is not a recognized config key via `hermes
      # config get`, so this ConfigMap can't carry that pin declaratively).
      mcp-vikunja-t:
        url: http://mcp-vikunja-t.mcp-personal.svc.cluster.local:8080/mcp
        enabled: true
      mcp-caldav-t:
        url: http://mcp-caldav-t.mcp-personal.svc.cluster.local:8080/mcp
        enabled: true

  # Top-level keys git enforces on EVERY pod start, merged over the live
  # /opt/data/config.yaml by the seed-config initContainer's second step
  # (shallow, top-level-key overwrite only — see deployment-hermes-t.yaml).
  # Distinct from config.yaml above, which only ever seeds a fresh PVC
  # (bug-895/bug-936: copy-if-missing means config.yaml's contents stop
  # applying the moment /opt/data/config.yaml exists).
  #
  # toolsets: enables the kanban toolset so kanban_* agent tools and the
  # /kanban dashboard tab become available (_profile_has_kanban_toolset()
  # in tools/kanban_tools.py requires "kanban" in config's top-level
  # `toolsets:` list; there is no HERMES_TOOLSETS env var).
  #
  # model/terminal/memory: bug-956 (2026-09-16) — this exact gap (declared
  # here, never applied) meant hermes-t had NO model configured live and
  # was silently falling back to deepseek-v4-pro since at least 2026-09-10,
  # until that fallback broke ("cannot access the LLM model" / WebSocket
  # 1006). Moving these three blocks into the managed layer is what stops
  # it from silently drifting again — they're now enforced on every pod
  # start instead of only on first PVC seed. Values match the model/
  # terminal/memory blocks above verbatim (kept in both places: the plain
  # config.yaml key still matters for a genuinely fresh PVC seed, before
  # this managed layer's first merge has ever run).
  #
  # kanban.auto_decompose: false — CRITICAL SAFETY SETTING (bug-975,
  # 2026-09-16). hermes-agent's kanban.auto_decompose defaults to TRUE
  # (config_defaults.py) — a gateway dispatcher tick (interval=60s, up to
  # auto_decompose_per_tick=3 per tick) that automatically flesh-outs,
  # ASSIGNS, and PROMOTES ANY triage card to ready with zero human gate.
  # hermes-agent's own source (gateway/kanban_watchers.py) carries a
  # comment acknowledging this exact failure mode: "auto-decompose created
  # and launched destructive tasks while the user [...]". This directly
  # contradicted the documented safety model in KANBAN.md ("triage is
  # inert") — confirmed live 2026-09-16 when dragging one migrated
  # security-backlog card into triage caused the dispatcher to
  # auto-rewrite its body into a destructive action plan (sudo
  # loginctl terminate-user root on xsvr3 + a git push triggering a
  # fleet-wide CI/CD deploy) and spawn a live worker (killed within
  # minutes, task blocked, global `hermes pause` engaged pending this
  # fix). Every `ops`-board alert card lands in triage too (kanban_card_
  # upsert.ts's --triage flag) and was equally exposed. Disabling this is
  # what actually makes "triage is inert" true — the --triage flag alone
  # never provided that guarantee.
  config-managed.yaml: |
    toolsets:
      - kanban

    kanban:
      auto_decompose: false

    model:
      default: qwen3-30b-a3b
      provider: custom
      base_url: http://xcog1.lan:4000/v1
      api_key: "${LITELLM_MASTER_KEY}"

    terminal:
      backend: local

    memory:
      memory_enabled: true
      backend: hindsight
      hindsight:
        mode: local_external
        api_url: http://hindsight.hindsight.svc.cluster.local:8888
        bank_id: hermes-t
