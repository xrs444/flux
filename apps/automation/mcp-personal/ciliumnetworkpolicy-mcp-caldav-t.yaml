# Network-segmentation project. Same rationale as
# ciliumnetworkpolicy-mcp-vikunja-t.yaml — ingress restricted to hermes-t
# only, the isolation this project traces back to. Egress to radicale only,
# needed both by the main container's tool calls and by the preflight
# initContainer's own PROPFIND (deployment-mcp-caldav-t.yaml) — both run
# under this same pod identity/endpointSelector.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-caldav-t
  namespace: mcp-personal
spec:
  endpointSelector:
    matchLabels:
      app: mcp-caldav-t
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-t
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: radicale
            k8s:app: radicale
      toPorts:
        - ports:
            - port: "5232"
              protocol: TCP
