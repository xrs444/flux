# Network-segmentation project. Same shape as
# ciliumnetworkpolicy-mcp-caldav-t.yaml — see that file's header — mirrored
# for samantha: ingress from hermes-s only, egress to radicale only.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-caldav-s
  namespace: mcp-personal
spec:
  endpointSelector:
    matchLabels:
      app: mcp-caldav-s
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-s
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: radicale
            k8s:app: radicale
      toPorts:
        - ports:
            - port: "5232"
              protocol: TCP
