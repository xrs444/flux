# mcp-caldav-s — Radicale CalDAV/CardDAV tools for hermes-s, authenticating
# as the dedicated `hermes-s` service principal. Same shape and same
# caveats as deployment-mcp-caldav-t.yaml (stateless supergateway bridge,
# list-calendars blind to samantha/ and family/ — calendarUrl is pinned
# into hermes-s's config instead, see ../hermes-s/configmap-hermes-s-
# config.yaml) — see that file's header for the full rationale.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-caldav-s
  namespace: mcp-personal
  labels:
    app: mcp-caldav-s
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mcp-caldav-s
  template:
    metadata:
      labels:
        app: mcp-caldav-s
    spec:
      initContainers:
        - name: preflight
          image: ghcr.io/xrs444/mcp-personal@sha256:74138d4463804c122231b975dbf914ca671ad97fef117663520219456e419bd8
          command:
            - sh
            - -c
            - |
              set -e
              code=$(curl -s -o /dev/null -w '%{http_code}' -u "$CALDAV_USERNAME:$CALDAV_PASSWORD" \
                -X PROPFIND -H 'Depth: 0' "${CALDAV_BASE_URL}${CALDAV_USERNAME}/")
              echo "PROPFIND ${CALDAV_USERNAME}/ -> $code"
              case "$code" in 20*|207) exit 0 ;; *) exit 1 ;; esac
          env:
            - name: CALDAV_BASE_URL
              value: "http://radicale.radicale.svc.cluster.local:5232/"
            - name: CALDAV_USERNAME
              value: "hermes-s"
            - name: CALDAV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-personal-s
                  key: CALDAV_PASSWORD
      containers:
        - name: mcp-caldav-s
          image: ghcr.io/xrs444/mcp-personal@sha256:74138d4463804c122231b975dbf914ca671ad97fef117663520219456e419bd8
          command: ["supergateway"]
          args:
            - --stdio
            - "caldav-mcp"
            - --outputTransport
            - streamableHttp
            - --streamableHttpPath
            - "/mcp"
            - --port
            - "8080"
            - --healthEndpoint
            - "/healthz"
            - --logLevel
            - "info"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CALDAV_BASE_URL
              value: "http://radicale.radicale.svc.cluster.local:5232/"
            - name: CALDAV_USERNAME
              value: "hermes-s"
            - name: CALDAV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-personal-s
                  key: CALDAV_PASSWORD
            - name: TZ
              value: "America/Phoenix"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
