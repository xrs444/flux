# Home Assistant long-lived access token, used to authenticate mcpjungle's
# connection to HA's own native "Model Context Protocol Server" integration
# (Settings -> Devices & Services -> Add Integration -> "Model Context
# Protocol Server"), exposed at https://hass.xrs444.net/mcp_server/sse.
#
# IMPORTANT — do NOT register this as a direct "sse" transport server.
# mcpjungle 0.4.6 (confirmed current/latest as of 2026-08-25) will register
# an sse server and its CLI (`list servers`, `list tools --server X`) will
# happily report it as configured with all 31 tools "[ENABLED]" — but the
# live client-facing /mcp proxy endpoint silently never serves those tools
# to any client. Verified two ways: (1) a raw external probe against
# https://mcp.xrs444.net/mcp with a real client's bearer token returned 0
# homeassistant tools before and after a full pod restart; (2) fresh pod
# startup logs show zero connection attempts to hass.xrs444.net even when a
# client calls tools/list. Upstream tracking issue (still open even though
# the underlying SSE-support PR merged back in Sep 2025):
# https://github.com/mcpjungle/MCPJungle/issues/100
#
# WORKAROUND (what's actually registered today): bridge HA's sse endpoint to
# stdio using `supergateway` (https://github.com/supercorp-ai/supergateway,
# run via npx — the base image ghcr.io/mcpjungle/mcpjungle:0.4.6-stdio
# already ships node/npx per custom-image/Dockerfile), then register THAT as
# a stdio server. stdio transport is fully supported by the live proxy
# (same mechanism netbox/scanopy already use). No separate Deployment/
# Service needed — mcpjungle spawns the npx process itself.
#
# REGISTRATION:
#
#   1. Retrieve the token:
#        kubectl get secret sealedsecret-homeassistant-mcp-credentials -n mcp-gateway \
#          -o jsonpath='{.data.token}' | base64 -d
#
#   2. Write a stdio config file (the token goes directly in `args` as a
#      literal value — mcpjungle does not do live env-var interpolation at
#      spawn time, confirmed by inspecting `list servers` output for
#      netbox/scanopy, whose "${VAR}"-looking committed configs are just
#      documentation; the actually-registered values are literal):
#        {
#          "name": "homeassistant",
#          "transport": "stdio",
#          "description": "Home Assistant (hass.xrs444.net) native MCP Server integration, bridged SSE→stdio via supergateway (mcpjungle 0.4.6 does not proxy sse upstreams live — see github.com/mcpjungle/MCPJungle#100)",
#          "command": "npx",
#          "args": ["-y", "supergateway", "--sse", "https://hass.xrs444.net/mcp_server/sse", "--oauth2Bearer", "<token from step 1>"],
#          "env": {}
#        }
#
#   3. Copy that file into the mcpjungle pod and register it:
#        kubectl cp homeassistant-stdio.json mcp-gateway/<pod>:/tmp/homeassistant-stdio.json
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- \
#          /mcpjungle register -c /tmp/homeassistant-stdio.json --force
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- rm -f /tmp/homeassistant-stdio.json
#      (`--force` deregisters any existing "homeassistant" entry first —
#      safe to always include, matches the recipe used to fix this on
#      2026-08-25 after an earlier sse registration was silently inert.)
#
#   4. Add "homeassistant" to the --allow list for whichever mcp-client
#      tokens should reach it. mcpjungle has no allow-list PATCH — this is a
#      delete + recreate of the client, and you MUST pass --access-token
#      with the client's *existing* token or you'll rotate it out from under
#      any already-connected session:
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- /mcpjungle delete mcp-client claude-code
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- /mcpjungle create mcp-client claude-code \
#          --allow "omada,firewalla,scanopy,netbox,homeassistant" \
#          --access-token <existing token> \
#          --description "Claude Code (external, via IngressRoute mcp.xrs444.net)"
#      Never use --allow "*". (As of 2026-08-25 this step was already done
#      for claude-code/hermes-t — check `mcpjungle list mcp-clients` first,
#      the allow-list may already be current even if the server itself
#      needs re-registering.)
#
# Rotating the token: HA profile -> Security -> Long-Lived Access Tokens ->
# create a new one (old ones can be deleted from the same page), reseal
# (kubectl create secret generic ... --from-literal=token=<new> --dry-run=client -o yaml
# | kubeseal --controller-name=sealed-secrets --controller-namespace=sealed-secrets --format=yaml),
# replace this file's encryptedData, commit+push, then re-run step 3 with
# `mcpjungle register -c /tmp/homeassistant-stdio.json --force` (deregisters
# + re-registers under the same name).
# yamllint disable rule:line-length
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sealedsecret-homeassistant-mcp-credentials
  namespace: mcp-gateway
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: sealedsecret-homeassistant-mcp-credentials
      namespace: mcp-gateway
