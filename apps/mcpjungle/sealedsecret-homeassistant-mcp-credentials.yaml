# Home Assistant long-lived access token, used to authenticate mcpjungle's
# SSE connection to HA's own native "Model Context Protocol Server"
# integration (Settings -> Devices & Services -> Add Integration -> "Model
# Context Protocol Server"). Unlike firewalla/omada (custom wrapper
# Deployments) or scanopy/netbox (vendored stdio servers spawned by
# mcpjungle itself), this is a "sse" transport upstream pointing directly at
# HA's own endpoint — no code runs inside the cluster for this one, HA's
# official integration is the only thing trusted.
#
# Nothing mounts this directly — the sse server credential is injected
# entirely at `mcpjungle register` time (bearer_token in the JSON config,
# see below), not via pod env vars. This Secret exists purely for
# encrypted-at-rest storage + easy retrieval when (re-)registering, same
# pattern as sealedsecret-scanopy-mcp-credentials.yaml.
#
# REGISTRATION:
#
#   1. Retrieve the token:
#        kubectl get secret sealedsecret-homeassistant-mcp-credentials -n mcp-gateway \
#          -o jsonpath='{.data.token}' | base64 -d
#
#   2. Write a config file (sse transport requires a JSON config — CLI flags
#      only work for streamable_http servers, confirmed via
#      `mcpjungle register --help`):
#        {
#          "name": "homeassistant",
#          "transport": "sse",
#          "description": "Home Assistant (hass.xrs444.net) native MCP Server integration",
#          "url": "https://hass.xrs444.net/mcp_server/sse",
#          "bearer_token": "<token from step 1>"
#        }
#
#   3. Copy that file into the mcpjungle pod and register it:
#        kubectl cp homeassistant.json mcp-gateway/<pod>:/tmp/homeassistant.json
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- \
#          /mcpjungle register -c /tmp/homeassistant.json
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- rm -f /tmp/homeassistant.json
#
#   4. Add "homeassistant" to the --allow list for whichever mcp-client
#      tokens should reach it. mcpjungle has no allow-list PATCH — this is a
#      delete + recreate of the client, and you MUST pass --access-token
#      with the client's *existing* token or you'll rotate it out from under
#      any already-connected session:
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- /mcpjungle delete mcp-client claude-code
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- /mcpjungle create mcp-client claude-code \
#          --allow "omada,firewalla,scanopy,netbox,homeassistant" \
#          --access-token <existing token> \
#          --description "Claude Code (external, via IngressRoute mcp.xrs444.net)"
#      Never use --allow "*".
#
# Rotating the token: HA profile -> Security -> Long-Lived Access Tokens ->
# create a new one (old ones can be deleted from the same page), reseal
# (kubectl create secret generic ... --from-literal=token=<new> --dry-run=client -o yaml
# | kubeseal --controller-name=sealed-secrets --controller-namespace=sealed-secrets --format=yaml),
# replace this file's encryptedData, commit+push, then re-run step 3 with
# `mcpjungle register -c /tmp/homeassistant.json --force` (deregisters +
# re-registers under the same name).
# yamllint disable rule:line-length
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sealedsecret-homeassistant-mcp-credentials
  namespace: mcp-gateway
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: sealedsecret-homeassistant-mcp-credentials
      namespace: mcp-gateway
