[project]
name = "scanopy-mcp-rw"
version = "0.1.0"
description = "A read/write MCP server for Scanopy (network topology/discovery)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # <2.0.0 pinned deliberately: mcp 2.x removed/renamed the mcp.server.fastmcp
    # import path this server (and ../netbox-mcp-rw/) uses (ModuleNotFoundError
    # at startup). The 2026-11-04 dependency bump rewrote this to >=2.3.0 and
    # the 2026-11-14 image rebuild shipped mcp 2.3.0, taking both the netbox and
    # scanopy MCP servers down (fixed 2026-11-26). Do NOT bump past 1.x until
    # server.py is migrated to the 2.x MCPServer API; renovate.json holds mcp <2.
    "mcp[cli]>=1.30.0,<2.0.0",
    "requests>=2.31.0",
]
