# mcp-firewalla — HTTP MCP server exposing Firewalla network monitoring/
# control tools. Registered into MCPJungle as a streamable_http upstream
# (see mcpjungle-registration configmap in this kustomization).
#
# No documented HTTP health-check path exists in this image (confirmed by
# inspecting dist/server.js: any request not matching MCP_HTTP_PATH returns
# a bare 404, and the HealthCheckManager class isn't wired to an HTTP
# route) — using a TCP socket probe instead of guessing a path.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-firewalla
  namespace: mcp-gateway
  labels:
    app: mcp-firewalla
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mcp-firewalla
  template:
    metadata:
      labels:
        app: mcp-firewalla
    spec:
      containers:
        - name: mcp-firewalla
          image: amittell/firewalla-mcp-server:2.1.1
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_HTTP_PORT
              value: "8080"
            - name: MCP_HTTP_PATH
              value: "/mcp"
            # v2.0.0 made every state-changing tool opt-in (default server is
            # read-only, 24 tools). pause_rule, resume_rule and the three
            # *_target_list tools were always on before; keep them.
            - name: FIREWALLA_ENABLE_WRITE_TOOLS
              value: "true"
            # v2 refuses to listen on 0.0.0.0 without a bearer token. The same
            # value is held by mcpjungle (registered with --bearer-token; the
            # registration lives in its SQLite DB on the PVC, so re-run
            # `/mcpjungle register --name firewalla ... --bearer-token <t> --force`
            # with this secret's bearer-token if that PVC is ever reset).
            - name: MCP_HTTP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-firewalla-credentials
                  key: bearer-token
            # v2 rejects any request whose Host header isn't listed (403 "Host
            # not allowed"). Default is localhost only; mcpjungle calls the
            # in-cluster service name.
            - name: MCP_HTTP_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,[::1],mcp-firewalla,mcp-firewalla.mcp-gateway,mcp-firewalla.mcp-gateway.svc,mcp-firewalla.mcp-gateway.svc.cluster.local"
            - name: FIREWALLA_MSP_ID
              value: "dn-j3almw.firewalla.net"
            - name: FIREWALLA_MSP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-firewalla-credentials
                  key: msp-token
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
