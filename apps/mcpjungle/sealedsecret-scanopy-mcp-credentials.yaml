# Dedicated Scanopy User API Key for scanopy-mcp-rw — a Scanopy account-scoped
# Bearer token, NOT tied to a personal admin session. Scanopy doesn't support
# scoped/limited API keys (any User API Key is full-account access), so the
# point of a dedicated key is independent rotatability, not reduced privilege.
#
# Nothing mounts this directly — scanopy-mcp-rw runs as a stdio backend the
# mcpjungle pod spawns itself (see custom-image/Dockerfile), and stdio server
# credentials are injected entirely at `mcpjungle register` time, not via pod
# env vars. This Secret exists purely for encrypted-at-rest storage + easy
# retrieval when (re-)registering.
#
# REGISTRATION (fixes the gap netbox-mcp-rw has today — its own registration
# params are undocumented anywhere in this repo; confirmed live 2026-08-07
# that netbox isn't even currently registered as an mcpjungle server at all,
# `mcpjungle list servers` only shows omada + firewalla):
#
#   1. Retrieve the token:
#        kubectl get secret sealedsecret-scanopy-mcp-credentials -n mcp-gateway \
#          -o jsonpath='{.data.token}' | base64 -d
#
#   2. The registration JSON is baked into the custom image at
#      /opt/scanopy-mcp-rw/mcp-register.json (source:
#      apps/mcpjungle/custom-image/scanopy-mcp-rw/mcp-register.json) — no
#      kubectl cp needed, unlike the old approach where the file only existed
#      in the pod's ephemeral /tmp and vanished on every restart.
#      ${SCANOPY_TOKEN} inside it is resolved from the calling shell's
#      environment at registration time (by mcpjungle itself, as a
#      subprocess of the `sh -c` below), not stored literally.
#
#   3. Register it:
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- \
#          sh -c 'SCANOPY_TOKEN="<token from step 1>" /mcpjungle register -c /opt/scanopy-mcp-rw/mcp-register.json'
#
#   4. Add "scanopy" to the --allow list for whichever mcp-client tokens
#      should reach it (Claude Code's, Hermes's) — never "*".
#
# Rotating the key: mint a new one in the Scanopy UI (Platform > API Keys),
# reseal (kubectl create secret generic ... --from-literal=token=<new> --dry-run=client -o yaml
# | kubeseal --controller-name=sealed-secrets --controller-namespace=sealed-secrets --format=yaml),
# replace this file's encryptedData, commit+push, then re-run step 3 with
# --force (mcpjungle register --force deregisters + re-registers under the
# same name). Registered-server *state* itself already survives mcpjungle pod
# restarts (SQLite DB on the mcpjungle-data PVC, see deployment-mcpjungle.yaml)
# — re-running step 3 is only needed when the token value actually changes.
# yamllint disable rule:line-length
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sealedsecret-scanopy-mcp-credentials
  namespace: mcp-gateway
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: sealedsecret-scanopy-mcp-credentials
      namespace: mcp-gateway
