# Home Assistant "Node-RED" add-on (hassio-addons/addon-node-red,
# a0d7b954_nodered), used to authenticate mcpjungle's stdio nodered-mcp-rw
# process against Node-RED's admin API at https://hass.xrs444.net:1880.
#
# IMPORTANT — this is HTTP Basic Auth using a real Home Assistant user's
# username/password, NOT a Node-RED-native adminAuth token and NOT HA's
# ingress (cookie/session) auth. Discovered 2026-08-29 while wiring this up:
#
#   - The add-on's config schema has no username/password option of its own
#     for the editor/admin API — its settings.js explicitly says
#     "adminAuth (known as users in the app configuration)" is handled by the
#     add-on itself, not exposed as a settings.js field.
#   - The add-on config has `auth_api: true` (config.yaml), which is what
#     actually gates this: going directly to the add-on's exposed port
#     (enabled via Network -> set a port number, bypassing the HA ingress
#     proxy that only supports browser cookie-session auth) hits an nginx
#     front door that validates credentials against Home Assistant's own
#     Auth API, not a Node-RED-local user list.
#   - Confirmed via `curl -sv -k https://172.18.7.1:1880/` ->
#     `WWW-Authenticate: Basic realm="Home Assistant Authentication"`, a
#     plain 401 challenge — no OAuth2 /auth/token exchange involved at all.
#   - The upstream MCP server (karavaev-evgeniy/node-red-mcp-server) only
#     ever sends `Authorization: Bearer <token>`, which this front door
#     rejects outright. It had to be forked — see
#     custom-image/nodered-mcp-rw/ (patched lib/utils.mjs + lib/server.mjs to
#     add NODE_RED_USERNAME/NODE_RED_PASSWORD Basic-auth support, plus an
#     opt-in NODE_RED_INSECURE_TLS since the add-on's direct-access TLS cert
#     (CN=hass.xrs444.net, Let's Encrypt) was found EXPIRED during setup —
#     fix that cert / restart the add-on to pick up a renewed one before
#     reaching for the insecure flag).
#   - Use the dedicated HA user created for this (not the primary admin
#     account) — least-privilege service account, same reasoning as any
#     other credential in this file.
#
# REGISTRATION:
#
#   1. Retrieve the credentials:
#        kubectl get secret sealedsecret-nodered-mcp-credentials -n mcp-gateway \
#          -o jsonpath='{.data.username}' | base64 -d; echo
#        kubectl get secret sealedsecret-nodered-mcp-credentials -n mcp-gateway \
#          -o jsonpath='{.data.password}' | base64 -d; echo
#
#   2. Write a stdio config file (literal values — see the note in
#      sealedsecret-homeassistant-mcp-credentials.yaml on why mcpjungle needs
#      literal values here, not "${VAR}" placeholders):
#        {
#          "name": "nodered",
#          "transport": "stdio",
#          "description": "Home Assistant Node-RED add-on (flows/nodes/settings control), patched fork of karavaev-evgeniy/node-red-mcp-server for HA Basic Auth",
#          "command": "node",
#          "args": ["/opt/nodered-mcp-rw/bin/node-red-mcp-server.mjs"],
#          "env": {
#            "NODE_RED_URL": "https://hass.xrs444.net:1880",
#            "NODE_RED_USERNAME": "<username from step 1>",
#            "NODE_RED_PASSWORD": "<password from step 1>"
#          }
#        }
#
#   3. Copy that file into the mcpjungle pod and register it:
#        kubectl cp nodered-stdio.json mcp-gateway/<pod>:/tmp/nodered-stdio.json
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- \
#          /mcpjungle register -c /tmp/nodered-stdio.json --force
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- rm -f /tmp/nodered-stdio.json
#
#   4. Add "nodered" to the --allow list for whichever mcp-client tokens
#      should reach it (delete + recreate — see
#      sealedsecret-homeassistant-mcp-credentials.yaml step 4 for the full
#      caveat about passing --access-token with the *existing* token):
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- /mcpjungle delete mcp-client claude-code
#        kubectl exec -n mcp-gateway deploy/mcpjungle -- /mcpjungle create mcp-client claude-code \
#          --allow "omada,firewalla,scanopy,netbox,homeassistant,nodered" \
#          --access-token <existing token> \
#          --description "Claude Code (external, via IngressRoute mcp.xrs444.net)"
#
# Generating/rotating the SealedSecret itself (run locally — this repo
# doesn't fabricate encryptedData, only kubeseal against the real cluster
# cert can):
#   kubectl create secret generic sealedsecret-nodered-mcp-credentials \
#     -n mcp-gateway \
#     --from-literal=username=<HA username> \
#     --from-literal=password=<HA password> \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-name=sealed-secrets --controller-namespace=sealed-secrets --format=yaml \
#   > sealedsecret-nodered-mcp-credentials.yaml.new
# then merge the resulting `encryptedData` block into this file (keep this
# header) and replace the placeholder below, commit+push, then run step 3
# with `--force` (deregisters + re-registers under the same name).
#
# yamllint disable rule:line-length
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sealedsecret-nodered-mcp-credentials
  namespace: mcp-gateway
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: sealedsecret-nodered-mcp-credentials
      namespace: mcp-gateway
