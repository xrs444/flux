# MCP gateway for higher-trust integrations (Firewalla, Omada, NetBox-rw,
# arr, Home Assistant, Jellyfin) — distinct from mcp-tools (read-only,
# ambient-trust-fine observability MCPs). MCPJungle is the single gateway:
# one /mcp endpoint, per-client bearer tokens + server allow-lists,
# consumed by both Claude Code (external, via IngressRoute) and Hermes
# (in-cluster, via ClusterIP).
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-gateway
  labels:
    # Network-segmentation project, T1 onboarding. See
    # infrastructure/configs/network-policies/ for the baselines this
    # activates, and ciliumnetworkpolicy-{mcpjungle,mcp-firewalla,mcp-omada}.yaml
    # for app-specific rules — one CNP per Deployment, same granularity as
    # the existing deployment-*.yaml files in this directory.
    netpol.homeprod/enforce: "true"
