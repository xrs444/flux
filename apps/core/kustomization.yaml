---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./helmrepositories
  - ./kube-system
  - ./metrics-server
  - ./kube-state-metrics
  - ./node-exporter
  - ./spegel
  - ./storage

# Self-hosted-apps priority tier + even-spread preference. See
# infrastructure/configs/priority-classes/ and the 2026-10-29 xsvr1 incident.
patches:
  - path: priority-high-deployment-patch.yaml
    target:
      kind: Deployment
  - path: priority-high-statefulset-patch.yaml
    target:
      kind: StatefulSet
  - path: topospread-deployment-patch.yaml
    target:
      kind: Deployment
  - path: topospread-statefulset-patch.yaml
    target:
      kind: StatefulSet
  - path: restart-jitter-deployment-patch.yaml
    target:
      kind: Deployment
  - path: restart-jitter-statefulset-patch.yaml
    target:
      kind: StatefulSet
