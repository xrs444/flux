apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  values:
    args:
      - --kubelet-insecure-tls
      - --tls-cert-file=/certs/tls.crt
      - --tls-private-key-file=/certs/tls.key
    extraVolumes:
      - name: wildcard-cert
        secret:
          secretName: letsencrypt-wildcard-cert-xrs444.net
    extraVolumeMounts:
      - name: wildcard-cert
        mountPath: /certs
        readOnly: true
    # Chart default only sets a request (100m/200Mi), no limit. Pinned to
    # xsvr2 along with the rest of the monitoring stack so cluster metrics
    # stay available during an OOM event on another node — see
    # Talos/patches/v-k8s-xsvr2.yaml for the reserved node-role.kubernetes.io/
    # ha-only taint/label this tolerates/matches.
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 512Mi
    tolerations:
      - key: node-role.kubernetes.io/ha-only
        operator: Equal
        value: reserved
        effect: NoSchedule
      # xsvr2 is ALSO a control-plane node and already carries this taint —
      # see descheduler's helmrelease for the full explanation.
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/ha-only
                  operator: In
                  values:
                    - reserved
