---
# Samba Active Directory Domain Controller
# Domain: AD.LAB.XRS444.NET  |  NetBIOS: LAB  |  DC hostname: dc1
# Image: nowsci/samba-domain — handles first-run `samba-tool domain provision`
#   automatically when /etc/samba/external/smb.conf does not exist (NOT
#   /var/lib/samba/private/sam.ldb — that was a wrong assumption in an earlier
#   version of this comment, and the reason the domain was silently
#   re-provisioned on every pod replacement until 2026-09-15: this sentinel
#   lives outside /var/lib/samba and was unmounted, so it never survived a
#   restart). /etc/samba/external is now its own PVC (samba-dc-etc), seeded on
#   first use by the initContainer below from configmap-samba-smbconf.yaml.
# Data persisted in Longhorn PVCs (samba-dc-data, samba-dc-etc — both carry the
# recurring-job-group.longhorn.io/default backup label); the provision script
# is mounted read-only from ConfigMap and executed by the CronJob (see
# cronjob-samba-provision.yaml). AD-native backups run via
# cronjob-samba-backup.yaml onto NFS (pv-samba-dc-backups-nfs.yaml).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: samba-dc
  namespace: samba-dc
  labels:
    app: samba-dc
spec:
  serviceName: samba-dc-headless
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: samba-dc
  template:
    metadata:
      labels:
        app: samba-dc
    spec:
      # DC hostname must be stable and short; used in Kerberos keytabs + DNS SRV records
      hostname: dc1
      subdomain: samba-dc-headless
      initContainers:
        - name: seed-smbconf
          # Seeds /etc/samba/external/smb.conf on FIRST USE of the samba-dc-etc
          # volume only. If the file is already there (normal restart, or a
          # previous run of this initContainer), do nothing — the entrypoint's
          # first-run check must see it as already provisioned, or it will
          # re-run `samba-tool domain provision` and wipe the domain again.
          image: nowsci/samba-domain:20260701025204
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /etc/samba/external/smb.conf ]; then
                echo "samba-dc-etc volume is empty — seeding known-good smb.conf"
                cp /seed/smb.conf /etc/samba/external/smb.conf
              else
                echo "smb.conf already present on samba-dc-etc — leaving domain untouched"
              fi
          volumeMounts:
            - name: samba-etc
              mountPath: /etc/samba/external
            - name: smbconf-seed
              mountPath: /seed
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: samba-dc
          image: nowsci/samba-domain:20260701025204
          envFrom:
            - configMapRef:
                name: samba-dc-config
          env:
            - name: DOMAINPASS
              valueFrom:
                secretKeyRef:
                  name: samba-dc-secrets
                  key: admin-password
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: krb-tcp
              containerPort: 88
              protocol: TCP
            - name: krb-udp
              containerPort: 88
              protocol: UDP
            - name: rpc
              containerPort: 135
              protocol: TCP
            - name: ldap
              containerPort: 389
              protocol: TCP
            - name: ldap-udp
              containerPort: 389
              protocol: UDP
            - name: smb
              containerPort: 445
              protocol: TCP
            - name: kpasswd-tcp
              containerPort: 464
              protocol: TCP
            - name: kpasswd-udp
              containerPort: 464
              protocol: UDP
            - name: ldaps
              containerPort: 636
              protocol: TCP
            - name: gc
              containerPort: 3268
              protocol: TCP
            - name: gcs
              containerPort: 3269
              protocol: TCP
            # Narrowed RPC dynamic port range (see postStart hook below) — exposed
            # so domain-join RPC callbacks (e.g. DNS record registration) can reach
            # the ephemeral port negotiated via the endpoint mapper on 135.
            - name: rpc-dyn-49152
              containerPort: 49152
              protocol: TCP
            - name: rpc-dyn-49153
              containerPort: 49153
              protocol: TCP
            - name: rpc-dyn-49154
              containerPort: 49154
              protocol: TCP
            - name: rpc-dyn-49155
              containerPort: 49155
              protocol: TCP
            - name: rpc-dyn-49156
              containerPort: 49156
              protocol: TCP
            - name: rpc-dyn-49157
              containerPort: 49157
              protocol: TCP
            - name: rpc-dyn-49158
              containerPort: 49158
              protocol: TCP
            - name: rpc-dyn-49159
              containerPort: 49159
              protocol: TCP
            - name: rpc-dyn-49160
              containerPort: 49160
              protocol: TCP
            - name: rpc-dyn-49161
              containerPort: 49161
              protocol: TCP
            - name: rpc-dyn-49162
              containerPort: 49162
              protocol: TCP
            - name: rpc-dyn-49163
              containerPort: 49163
              protocol: TCP
            - name: rpc-dyn-49164
              containerPort: 49164
              protocol: TCP
            - name: rpc-dyn-49165
              containerPort: 49165
              protocol: TCP
            - name: rpc-dyn-49166
              containerPort: 49166
              protocol: TCP
            - name: rpc-dyn-49167
              containerPort: 49167
              protocol: TCP
            - name: rpc-dyn-49168
              containerPort: 49168
              protocol: TCP
            - name: rpc-dyn-49169
              containerPort: 49169
              protocol: TCP
            - name: rpc-dyn-49170
              containerPort: 49170
              protocol: TCP
            - name: rpc-dyn-49171
              containerPort: 49171
              protocol: TCP
            - name: rpc-dyn-49172
              containerPort: 49172
              protocol: TCP
          volumeMounts:
            - name: samba-data
              mountPath: /var/lib/samba
            # Persists the image's first-run sentinel (see header comment) —
            # without this, every pod replacement re-provisions the domain.
            - name: samba-etc
              mountPath: /etc/samba/external
            - name: provision-scripts
              mountPath: /provision
            # Users/groups mounted separately — can't subPath into an existing mountpoint
            - name: provision-users
              mountPath: /provision-users
            # Target for cronjob-samba-backup.yaml's `samba-tool domain backup offline`
            - name: samba-backups
              mountPath: /backups
          # After Samba starts, patch smb.conf so samba_dnsupdate only registers
          # the LB IP (HOSTIP) instead of the pod's eth0 IP, which is not routable
          # externally. Then delete any stale pod-IP DNS records.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Wait for Samba to write smb.conf and start
                    until [ -f /etc/samba/smb.conf ]; do sleep 2; done
                    sleep 5
                    # Inject settings that samba's startup script resets on each restart
                    if ! grep -q "^[[:space:]]*interfaces" /etc/samba/smb.conf; then
                      sed -i "/^\[global\]/a\\\tinterfaces = lo ${HOSTIP}\n\tbind interfaces only = no" /etc/samba/smb.conf
                    fi
                    # Allow simple LDAP binds — Samba AD blocks plain-text auth by default
                    # even over TLS; this is required for OpenRSAT and Nutanix LDAP bind
                    if ! grep -q "ldap server require strong auth" /etc/samba/smb.conf; then
                      sed -i "/^\[global\]/a\\\tldap server require strong auth = no" /etc/samba/smb.conf
                    fi
                    # Narrow the RPC dynamic port range so it can be exposed through the
                    # LoadBalancer Service. Without this, only the endpoint mapper (135)
                    # is reachable — the actual RPC callback (e.g. DsrUpdateReadOnlyServerDnsRecord
                    # during domain join) gets an ephemeral port from Samba's default
                    # 49152-65535 range that is never routed, and the client sees
                    # "RPC server unavailable".
                    if ! grep -q "rpc server dynamic port range" /etc/samba/smb.conf; then
                      sed -i "/^\[global\]/a\\\trpc server dynamic port range = 49152-49172" /etc/samba/smb.conf
                    fi
                    # Wait for LDAP to be up, then purge pod-IP DNS records
                    POD_IP=$(hostname -I | awk '{print $1}')
                    until samba-tool domain info 127.0.0.1 >/dev/null 2>&1; do sleep 5; done
                    sleep 5
                    samba-tool dns delete 127.0.0.1 "$REALM" @ A "$POD_IP" 2>/dev/null || true
                    samba-tool dns delete 127.0.0.1 "$REALM" "$(hostname -s)" A "$POD_IP" 2>/dev/null || true
          # Allow enough time for first-run domain provisioning (~60s typical)
          startupProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            privileged: true
      volumes:
        - name: samba-data
          persistentVolumeClaim:
            claimName: samba-dc-data
        - name: samba-etc
          persistentVolumeClaim:
            claimName: samba-dc-etc
        - name: smbconf-seed
          configMap:
            name: samba-smbconf-seed
        - name: samba-backups
          persistentVolumeClaim:
            claimName: samba-dc-backups-pvc
        - name: provision-scripts
          configMap:
            name: samba-provision-scripts
            defaultMode: 0755
        - name: provision-users
          configMap:
            name: samba-users
