# SealedSecret for Scanopy — postgres DB password + the full SCANOPY_OIDC_PROVIDERS
# TOML block (embeds the Kanidm oauth2_scanopy client secret from
# nix/secrets/kanidm_oauth2_secrets.yaml). Already sealed against the live
# sealed-secrets controller — not a placeholder.
#
# Rotating db-password or the Kanidm client secret:
#   1. Kanidm oauth2_scanopy secret lives at nix/secrets/kanidm_oauth2_secrets.yaml
#      (key kanidm_oauth2_scanopy_secret); decrypt with:
#        sops -d --extract '["kanidm_oauth2_scanopy_secret"]' nix/secrets/kanidm_oauth2_secrets.yaml
#   2. Rebuild the oidc-providers TOML (see provider fields below) and/or a new
#      db-password (openssl rand -hex 24).
#   3. kubectl create secret generic sealedsecret-scanopy --namespace scanopy \
#        --from-literal=db-password="<value>" \
#        --from-file=oidc-providers=<toml-file> \
#        --dry-run=client -o yaml | \
#      kubeseal --controller-name=sealed-secrets \
#               --controller-namespace=sealed-secrets --format=yaml > sealedsecret-scanopy.yaml
#
# oidc-providers TOML shape (single [[providers]] block, slug "kanidm" — must
# match the add_redirect callback path in nix/modules/services/kanidm/default.nix):
#   [[providers]]
#   name = "Kanidm"
#   slug = "kanidm"
#   issuer_url = "https://idm.xrs444.net/oauth2/openid/oauth2_scanopy"
#   client_id = "oauth2_scanopy"
#   client_secret = "<kanidm oauth2_scanopy secret>"
# yamllint disable rule:line-length
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sealedsecret-scanopy
  namespace: scanopy
spec:
  encryptedData:
    db-password: 
    oidc-providers: 
  template:
    metadata:
      name: sealedsecret-scanopy
      namespace: scanopy
