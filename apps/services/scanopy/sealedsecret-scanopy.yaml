# SealedSecret for Scanopy — postgres DB password + oidc.toml (mounted as a
# file, NOT an env var — see deployment-scanopy.yaml). Embeds the Kanidm
# oauth2_scanopy client secret from nix/secrets/kanidm_oauth2_secrets.yaml.
# Already sealed against the live sealed-secrets controller — not a
# placeholder.
#
# bug-fix note: Scanopy does NOT read OIDC config from a SCANOPY_OIDC_PROVIDERS
# env var — that was a wrong assumption and crash-looped the pod with
# `invalid type: found string ... expected a sequence for key "OIDC_PROVIDERS"`
# (Figment's env source expects JSON there, and a raw TOML string doesn't
# parse as JSON). It reads a TOML FILE via Figment, merged from "../oidc.toml"
# relative to the binary's CWD (WORKDIR /app in the image) — i.e. /oidc.toml
# in the container. The TOML key is `[[oidc_providers]]` (snake_case), not
# `[[providers]]` (confirmed against backend/src/server/config.rs and
# oidc.toml.example in github.com/scanopy/scanopy) — that was a second,
# independent mistake in the first attempt at this file.
#
# Rotating db-password or the Kanidm client secret:
#   1. Kanidm oauth2_scanopy secret lives at nix/secrets/kanidm_oauth2_secrets.yaml
#      (key kanidm_oauth2_scanopy_secret); decrypt with:
#        sops -d --extract '["kanidm_oauth2_scanopy_secret"]' nix/secrets/kanidm_oauth2_secrets.yaml
#   2. Rebuild oidc.toml (shape below) and/or a new db-password
#      (openssl rand -hex 24) — NOTE: postgres only reads POSTGRES_PASSWORD on
#      first init; changing db-password on an already-initialized PVC requires
#      also updating it inside postgres itself (ALTER ROLE), not just resealing.
#   3. kubectl create secret generic sealedsecret-scanopy --namespace scanopy \
#        --from-literal=db-password="<value>" \
#        --from-file=oidc-toml=<toml-file> \
#        --dry-run=client -o yaml | \
#      kubeseal --controller-name=sealed-secrets \
#               --controller-namespace=sealed-secrets --format=yaml > sealedsecret-scanopy.yaml
#
# oidc.toml shape (slug "kanidm" must match the add_redirect callback path in
# nix/modules/services/kanidm/default.nix):
#   [[oidc_providers]]
#   name = "Kanidm"
#   slug = "kanidm"
#   issuer_url = "https://idm.xrs444.net/oauth2/openid/oauth2_scanopy"
#   client_id = "oauth2_scanopy"
#   client_secret = "<kanidm oauth2_scanopy secret>"
# yamllint disable rule:line-length
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sealedsecret-scanopy
  namespace: scanopy
spec:
  encryptedData:
    db-password: 
    oidc-toml: 
  template:
    metadata:
      name: sealedsecret-scanopy
      namespace: scanopy
