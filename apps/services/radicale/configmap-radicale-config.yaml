---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radicale-config
  namespace: radicale
data:
  # Radicale configuration file — see https://radicale.org/v3.html#configuration
  #
  # Auth choice: htpasswd (per-family static credentials).
  #
  # Why not Kanidm OIDC? CalDAV / CardDAV protocols use HTTP Basic auth from
  # native clients (Apple Calendar, DAVx⁵, Thunderbird). OAuth flows require
  # an interactive redirect that clients don't support. LDAP (via Kanidm's
  # LDAP interface) is a viable upgrade later — Radicale supports it natively
  # via [auth] type = ldap, but requires binding-DN configuration and adds a
  # dependency on Kanidm's LDAP surface being reachable from the pod.
  #
  # For Phase A: htpasswd, one entry per family member plus service accounts
  # (homeassistant read-only, hermes-t/hermes-s read-write — see [rights]
  # below). Passwords are stored in the SealedSecret (radicale-users) and
  # read from /etc/radicale/users. sealed-secrets decrypts back to a normal
  # Secret, so the current file is always recoverable live — you do NOT
  # need to reset everyone's password to rotate or add one entry:
  #   kubectl get secret radicale-users -n radicale -o jsonpath='{.data.users}' \
  #     | base64 -d > users
  #   htpasswd -bB users <name> <password>   # -b -B; NEVER -c, it truncates
  #                                           # the file and wipes every
  #                                           # other user's password
  # then reseal the resulting file into the SealedSecret keyed as `users`
  # (kubectl create secret generic radicale-users -n radicale
  #  --from-file=users=users --dry-run=client -o yaml | kubeseal ...).
  # Note: deployment-radicale.yaml mounts this via subPath, which Kubernetes
  # never live-updates — `kubectl rollout restart deploy/radicale -n
  # radicale` is required after any change here or to the users Secret.
  #
  # Rights: moved from the built-in `owner_only` to a custom rights file
  # (2026-07-10) so a dedicated `homeassistant` service user can read every
  # family member's calendars for HA dashboards/automations without sharing
  # anyone's personal password. `homeassistant` gets R/r (read) only — no W/w
  # (write) — least privilege, since HA's CalDAV use case here is reading,
  # not creating events. Each human user still has full RW/rw on their own
  # collections, unchanged from owner_only's behavior. See rights key below
  # and https://radicale.org/v3.html#authentication-and-rights for the
  # permission-letter reference (R/W = collections, r/w = calendar/addressbook
  # items, {user} = the authenticated username).
  #
  # Shared "family" pseudo-principal (2026-07-10): xrs444 and samantha both
  # get full RW on a collection tree that isn't owned by either login —
  # /family/ — so a shared address book (or calendar, if wanted later) syncs
  # between them instead of one owning it and the other being a read-only
  # guest. CardDAV needs no separate enablement: Radicale's r/w permissions
  # cover address book collections the same as calendar collections, and the
  # collection itself is created on first write from whichever CardDAV
  # client adds it (e.g. Apple Contacts pointed at
  # https://radicale.xrs444.net/family/contacts/).
  config: |
    [server]
    hosts = 0.0.0.0:5232
    max_connections = 20
    max_content_length = 100000000
    timeout = 30

    [auth]
    type = htpasswd
    htpasswd_filename = /etc/radicale/users
    htpasswd_encryption = bcrypt

    [rights]
    type = from_file
    file = /etc/radicale/rights

    [storage]
    filesystem_folder = /data/collections

    [logging]
    level = info
  rights: |
    [root]
    user: .+
    collection:
    permissions: R

    [principal]
    user: .+
    collection: {user}
    permissions: RW

    [calendars]
    user: .+
    collection: {user}/[^/]+
    permissions: rw

    [homeassistant-principals-read]
    user: homeassistant
    collection: (xrs444|samantha|rowan|greyson)
    permissions: R

    [homeassistant-calendars-read]
    user: homeassistant
    collection: (xrs444|samantha|rowan|greyson)/[^/]+
    permissions: r

    [family-shared-principal]
    user: (xrs444|samantha)
    collection: family
    permissions: RW

    [family-shared-collections]
    user: (xrs444|samantha)
    collection: family/[^/]+
    permissions: rw

    # Hermes agent service principals (2026-09-11). hermes-t acts for
    # xrs444, hermes-s for samantha, from the MCP pods in the mcp-personal
    # namespace (flux/apps/automation/mcp-personal/). Dedicated principals
    # rather than reusing the humans' logins so an agent credential can be
    # rotated or revoked without touching anybody's phone/desktop CalDAV
    # clients.
    #
    # ORDER MATTERS: Radicale's from_file backend returns the FIRST section
    # whose user AND collection regexes both fullmatch. These stanzas must
    # stay at the END of this file — moving them above [principal]/
    # [calendars] would shadow those rules for these users.
    #
    # Note the generic [principal]/[calendars] rules above are `user: .+`,
    # so hermes-t and hermes-s each automatically get RW on their own
    # /hermes-t/, /hermes-s/ tree too. That is intentional and in fact
    # REQUIRED: the caldav-mcp server these principals authenticate as does
    # current-user-principal -> calendar-home-set discovery at startup and
    # exits if that home is unreachable, so each service principal needs a
    # reachable, writable home of its own. That home is a scratch tree the
    # agents own; it is NOT where the user's real data lives — see the
    # bootstrap step in apps/automation/mcp-personal/kustomization.yaml.
    #
    # RW by design — the agents create/complete events and todos, not just
    # read them.
    [hermes-t-xrs444-principal]
    user: hermes-t
    collection: xrs444
    permissions: RW

    [hermes-t-xrs444-collections]
    user: hermes-t
    collection: xrs444/[^/]+
    permissions: rw

    [hermes-t-family-principal]
    user: hermes-t
    collection: family
    permissions: RW

    [hermes-t-family-collections]
    user: hermes-t
    collection: family/[^/]+
    permissions: rw

    [hermes-s-samantha-principal]
    user: hermes-s
    collection: samantha
    permissions: RW

    [hermes-s-samantha-collections]
    user: hermes-s
    collection: samantha/[^/]+
    permissions: rw

    [hermes-s-family-principal]
    user: hermes-s
    collection: family
    permissions: RW

    [hermes-s-family-collections]
    user: hermes-s
    collection: family/[^/]+
    permissions: rw
