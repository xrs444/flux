# Network-segmentation project, T1 onboarding — last T1 namespace.
#
# No egress rule beyond the baselines (DNS/kubelet-health/observability):
# htpasswd auth (no OIDC/external IdP), PVC-backed storage, no external API
# dependency at all. iOS Calendar/DAVx⁵/Thunderbird/HA CalDAV clients
# (deployment-radicale.yaml's header comment) all reach this over the
# public hostname via Traefik — no direct LoadBalancer IP exists for this
# namespace (unlike the six "direct-LoadBalancer" namespaces the plan
# tracks separately), so a single ingress rule covers every consumer.
#
# mcp-personal (2026-09-15): hermes-t/-s reach their per-identity CalDAV
# MCP bridge pods, which in turn call radicale directly — not hermes.
# mcp-caldav-t / mcp-caldav-s are each restricted on their own side
# (apps/automation/mcp-personal/ciliumnetworkpolicy-mcp-caldav-{t,s}.yaml)
# to accept ingress only from hermes-t / hermes-s respectively, so this
# rule doesn't need to re-derive that isolation — either pod reaching
# radicale has already proven it's the right identity's bridge.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: radicale
  namespace: radicale
spec:
  endpointSelector:
    matchLabels:
      app: radicale
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mcp-personal
            k8s:app: mcp-caldav-t
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mcp-personal
            k8s:app: mcp-caldav-s
      toPorts:
        - ports:
            - port: "5232"
              protocol: TCP
