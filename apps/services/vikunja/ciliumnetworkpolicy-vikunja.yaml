# Network-segmentation project, T1 onboarding.
#
# Single Deployment, two containers (vikunja + postgres) sharing one pod
# network namespace — postgres is reached via `database.host: localhost`
# (configmap-vikunja-config.yaml), so it needs no CNP rule of its own; this
# one endpointSelector (app: vikunja) covers the whole pod.
#
# mcp-personal (2026-09-15): per-identity Vikunja MCP bridge pods for
# hermes-t/-s. mcp-vikunja-t / mcp-vikunja-s are each restricted on their
# own side (apps/automation/mcp-personal/ciliumnetworkpolicy-mcp-vikunja-
# {t,s}.yaml) to accept ingress only from hermes-t / hermes-s respectively
# — this is the isolation the whole network-segmentation project traces
# back to (see hermes-t's CNP comment for the same note from the other
# side), so this rule doesn't need to re-derive it.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vikunja
  namespace: vikunja
spec:
  endpointSelector:
    matchLabels:
      app: vikunja
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mcp-personal
            k8s:app: mcp-vikunja-t
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mcp-personal
            k8s:app: mcp-vikunja-s
      toPorts:
        - ports:
            - port: "3456"
              protocol: TCP
  egress:
    # Kanidm OIDC — auth.openid.providers.kanidm.authurl.
    - toFQDNs:
        - matchName: idm.xrs444.net
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
