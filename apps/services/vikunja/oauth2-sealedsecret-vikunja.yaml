# SealedSecret for Vikunja — Kanidm OAuth2 credentials + JWT + DB password.
#
# Rotating client-secret (bug-585-class fix, 2026-09-10): base64-generated
# secrets containing +/= trip an RFC 6749 form-urlencoding interop bug in
# some OIDC clients (Kanidm returns 401 "Invalid OAuth2 client_id secret"
# with an empty body — see the identical oauth2_scanopy fix). Use a
# hex-only secret instead: openssl rand -hex 32.
#
# Populate before deploying:
#   1. On xsvr1, after updating nix/secrets/kanidm_oauth2_secrets.yaml and
#      deploying, read the live value from:
#        /run/secrets/kanidm_oauth2_vikunja_secret
#      (kanidm.service has no restartUnits wired to this secret — restart
#      it manually so provision.nix's ExecStartPost re-applies the new
#      secret to the live oauth2_vikunja client: systemctl restart kanidm)
#   2. Generate: JWT_SECRET=$(openssl rand -hex 32); DB_PASSWORD=$(openssl rand -hex 24)
#   3. Seal:
#        kubectl create secret generic oauth2-secret-vikunja \
#          --namespace vikunja \
#          --from-literal=client-id=oauth2_vikunja \
#          --from-literal=client-secret="<kanidm oauth2 secret>" \
#          --from-literal=jwt-secret="$JWT_SECRET" \
#          --from-literal=db-password="$DB_PASSWORD" \
#          --dry-run=client -o yaml | \
#        kubeseal --controller-name=sealed-secrets \
#                 --controller-namespace=sealed-secrets \
#                 --format=yaml > oauth2-sealedsecret-vikunja.yaml
#
# Rotating any value: regenerate, reseal, `flux reconcile` — Vikunja pod
# picks up the new value on next restart (kubectl rollout restart).
# yamllint disable rule:line-length
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: oauth2-secret-vikunja
  namespace: vikunja
spec:
  encryptedData:
    client-id: 
    client-secret: 
    db-password: 
    jwt-secret: 
  template:
    metadata:
      name: oauth2-secret-vikunja
      namespace: vikunja
    type: Opaque
