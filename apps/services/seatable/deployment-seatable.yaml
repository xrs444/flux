---
# yamllint disable rule:line-length
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatable
  namespace: seatable
  labels:
    app: seatable
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seatable
  template:
    metadata:
      labels:
        app: seatable
    spec:
      initContainers:
        - name: seatable-config
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              # Create seatable config directory
              mkdir -p /shared/seatable/conf

              SETTINGS_FILE="/shared/seatable/conf/dtable_web_settings.py"

              # Create file with header if doesn't exist
              if [ ! -f "$SETTINGS_FILE" ]; then
                echo "# SeaTable Configuration" > "$SETTINGS_FILE"
                echo "# Auto-generated by init container" >> "$SETTINGS_FILE"
              fi

              # Inject URL configuration (idempotent - checks for marker)
              if ! grep -q "# SeaTable URL Configuration" "$SETTINGS_FILE"; then
                echo "" >> "$SETTINGS_FILE"
                cat /config-templates/url-settings.py >> "$SETTINGS_FILE"
              fi

              # Inject OAuth configuration (idempotent - checks for ENABLE_OAUTH)
              cat /config-templates/oauth-settings.py > /tmp/oauth-config.py
              echo "OAUTH_CLIENT_SECRET = '${OAUTH_CLIENT_SECRET}'" >> /tmp/oauth-config.py

              if ! grep -q "ENABLE_OAUTH" "$SETTINGS_FILE"; then
                echo "" >> "$SETTINGS_FILE"
                echo "# OAuth Configuration" >> "$SETTINGS_FILE"
                cat /tmp/oauth-config.py >> "$SETTINGS_FILE"
              fi

              echo "Configuration injection complete"
          env:
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-secret-seatable
                  key: client-secret
          volumeMounts:
            - name: seatable-data
              mountPath: /shared
            - name: seatable-config
              mountPath: /config-templates
      containers:
        - name: seatable
          image: seatable/seatable-enterprise:7.0.15
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SEATABLE_SERVER_HOSTNAME
              value: "seatable.xrs444.net"
            - name: SEATABLE_SERVER_PROTOCOL
              value: "https"
            - name: TIME_ZONE
              value: "America/Phoenix"
            - name: SEATABLE_MYSQL_DB_HOST
              value: "127.0.0.1"
            - name: SEATABLE_MYSQL_DB_PORT
              value: "3306"
            - name: SEATABLE_MYSQL_DB_USER
              value: "root"
            - name: SEATABLE_MYSQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: mariadb-root-password
            - name: INIT_SEATABLE_MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: mariadb-root-password
            - name: SEATABLE_MYSQL_DB_DTABLE_DB_NAME
              value: "dtable_db"
            - name: SEATABLE_MYSQL_DB_CCNET_DB_NAME
              value: "ccnet_db"
            - name: SEATABLE_MYSQL_DB_SEAFILE_DB_NAME
              value: "seafile_db"
            - name: REDIS_HOST
              value: "127.0.0.1"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: redis-password
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: jwt-private-key
            # 7.0: dtable-server runs as its own container (sidecar below), so
            # dtable-web / the API gateway reach it over the pod's loopback
            # rather than the compose hostname "dtable-server".
            - name: INNER_DTABLE_SERVER_URL
              value: "http://127.0.0.1:5000"
            # Required by the 7.0 compose for the server and the automation
            # worker; both must share the same value.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: secret-key
            # The dtable-server sidecar image runs its own dtable-storage-server
            # on :6666 (same /shared/seatable/storage-data, same conf). In the
            # compose layout each container has its own network namespace so
            # both can bind it; in this single pod they share one, so this
            # container's monitor.sh (which can't see the sidecar's process)
            # restarted a duplicate every minute and it died with "bind:
            # address already in use" (hundreds of times a day). Disable the
            # duplicate here; dtable-db reaches the sidecar's one on loopback.
            - name: ENABLE_DTABLE_STORAGE_SERVER
              value: "false"
            - name: SEATABLE_ADMIN_EMAIL
              value: "xrs444@xrs444.net"
            - name: SEATABLE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: admin-password
          volumeMounts:
            - name: seatable-data
              mountPath: /shared
            - name: seatable-license
              mountPath: /shared/seatable/seatable-license.txt
              subPath: seatable-license.txt
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        # --- SeaTable 7.0: dtable-server and the automation worker are no longer
        # part of the seatable-enterprise image. Both are required: without
        # dtable-server bases don't open, without the worker automations don't
        # run. Mirrors dtable-server.yml / seatable-automation-worker.yml from
        # seatable/seatable-release@v7.0.18, with compose hostnames replaced by
        # the pod's loopback (all containers share this pod, like mariadb/redis).
        - name: dtable-server
          image: seatable/dtable-server-js:7.0.14
          ports:
            - containerPort: 5000
              name: dtable-server
          env:
            - name: SEATABLE_MYSQL_DB_HOST
              value: "127.0.0.1"
            - name: SEATABLE_MYSQL_DB_PORT
              value: "3306"
            - name: SEATABLE_MYSQL_DB_USER
              value: "root"
            - name: SEATABLE_MYSQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: mariadb-root-password
            - name: SEATABLE_MYSQL_DB_DTABLE_DB_NAME
              value: "dtable_db"
            - name: REDIS_HOST
              value: "127.0.0.1"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: redis-password
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: jwt-private-key
            - name: TZ
              value: "America/Phoenix"
            - name: INNER_DTABLE_WEB_SERVICE_URL
              value: "http://127.0.0.1:80"
            - name: INNER_DTABLE_DB_URL
              value: "http://127.0.0.1:7777"
            - name: DTABLE_SERVER_LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: seatable-data
              mountPath: /shared
            - name: seatable-license
              mountPath: /shared/seatable/seatable-license.txt
              subPath: seatable-license.txt
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ping
              port: dtable-server
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: dtable-server
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
        - name: seatable-automation-worker
          image: seatable/automation-worker:7.0.14
          env:
            - name: SEATABLE_MYSQL_DB_HOST
              value: "127.0.0.1"
            - name: SEATABLE_MYSQL_DB_PORT
              value: "3306"
            - name: SEATABLE_MYSQL_DB_USER
              value: "root"
            - name: SEATABLE_MYSQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: mariadb-root-password
            - name: SEATABLE_MYSQL_DB_DTABLE_DB_NAME
              value: "dtable_db"
            - name: SEATABLE_MYSQL_DB_SEAFILE_DB_NAME
              value: "seafile_db"
            - name: SEATABLE_MYSQL_DB_CCNET_DB_NAME
              value: "ccnet_db"
            - name: REDIS_HOST
              value: "127.0.0.1"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: redis-password
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: jwt-private-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: secret-key
            - name: SEATABLE_SERVER_HOSTNAME
              value: "seatable.xrs444.net"
            - name: SEATABLE_SERVER_PROTOCOL
              value: "https"
            - name: TZ
              value: "America/Phoenix"
            - name: INNER_DTABLE_WEB_SERVICE_URL
              value: "http://127.0.0.1:80"
            - name: INNER_DTABLE_SERVER_URL
              value: "http://127.0.0.1:5000"
            - name: INNER_DTABLE_DB_URL
              value: "http://127.0.0.1:7777"
            - name: ENABLE_PYTHON_SCRIPT
              value: "false"
            - name: ENABLE_SEATABLE_AI
              value: "false"
            - name: SEATABLE_LOG_TO_STDOUT
              value: "true"
            - name: LOG_LEVEL
              value: "INFO"
            - name: STORAGE_TYPE
              value: "disk"
          volumeMounts:
            - name: seatable-data
              mountPath: /shared
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: mariadb
          image: mariadb:13
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: mariadb-root-password
            - name: MYSQL_LOG_CONSOLE
              value: "true"
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --max-connections=1000
            # SeaTable's supported MariaDB config (seatable-server.yml, 7.0).
            # Live values before this change: snapshot isolation ON, 16M packet.
            - --innodb_snapshot_isolation=OFF
            - --max-allowed-packet=32M
        - name: redis
          image: redis:8-alpine
          # 7.0's supported config runs Redis with a password and an
          # allkeys-lru maxmemory (compose default 500mb); sized here to stay
          # under the container limit.
          command:
            - /bin/sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD" --maxmemory 400mb --maxmemory-policy allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatable-secrets
                  key: redis-password
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 512Mi
      volumes:
        - name: seatable-data
          persistentVolumeClaim:
            claimName: seatable-data
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: seatable-mariadb-data
        - name: seatable-license
          secret:
            secretName: seatable-license
        - name: seatable-config
          configMap:
            name: seatable-config
