---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashy-auth
  namespace: dashy
spec:
  forwardAuth:
    address: http://oauth2-proxy-dashy.dashy.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashy-errors
  namespace: dashy
spec:
  errors:
    status:
      - "401-403"
    query: "/oauth2/sign_in?rd={url}"
    service:
      name: oauth2-proxy-dashy
      port: 4180
