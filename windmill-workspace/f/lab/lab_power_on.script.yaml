summary: Lab Power On
description: >-
  Powers on the Nutanix lab in sequence:

  1. Turns on HA smart plug (switch.lab_power) via webhook

  2. Waits for lab switch (xswlab, 172.18.11.249) to be reachable on port 22

  3. Powers on all three nodes via HP iLO 5 Redfish (session-token auth)

  4. Waits for CVMs (172.25.1.11/21/31) to be reachable on SSH

  5. Starts the Nutanix cluster via CVM SSH (cluster start)

  6. Boots Prism Central VM via acli vm.on xntnx-pc

  7. Waits for Prism Central (172.25.2.100:9440) to be reachable


  Prerequisites: iLO/CVM/Prism creds filled; worker SSH key in CVM
  authorized_keys; HA webhooks created.
lock: '!inline f/lab/lab_power_on.script.lock'
kind: script
schema: null
